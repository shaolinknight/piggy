      '<div class="bar' + (x.trip ? ' tbar' : '') + '"><i style="width:' + Math.max(2, x.a / max * 100).toFixed(1) + '%"></i></div><div class="l2">' + Math.round(x.a / (tot || 1) * 100) + '% of ' + MONTHS[ymM(k)] + '’s spending</div></button>';
  });
  if (rows.length > 10) h += '<div class="l2" style="margin-top:6px">+ ' + (rows.length - 10) + ' smaller categories</div>';
  return h + '</section>';
}

function trendMonth() {
  var cur = nowYM(), r = dataRange();
  var start = Math.max(r.lo, cur - 11), cols = [];
  for (var k = start; k <= cur; k++) {
    var s = monthStats(k);
    cols.push({ label: MON[ymM(k)].charAt(0) + (ymM(k) === 0 ? "'" + String(ymY(k)).slice(2) : ''), vals: [s.spentAll, s.inc], trip: s.trip,
      aria: MONTHS[ymM(k)] + ' ' + ymY(k),
      info: '<b>' + MONTHS[ymM(k)] + ' ' + ymY(k) + (k === cur ? ' (so far)' : '') + '</b><br>Spent ' + money(s.spentAll) + (s.trip ? ' (' + money(s.trip) + ' on trips)' : '') + ' · Income ' + money(s.inc) + ' · Saved ' + money(s.saved) + ' · Net <b>' + signed(s.inc - s.spentAll - s.saved) + '</b>' });
  }
  var h = calendarHtml() + '<section class="card"><div class="ghead"><h3>Spending vs income</h3><span>last 12 months</span></div>' +
    barChart('m12', cols, { legend: ['Spent', 'Income'] }) + '</section>';
  h += whereItWentHtml();

  // averages over the last 6 complete months
  var n = 0, tSp = 0, tIn = 0, tSv = 0, tTr = 0, catSum = {}, bSum = { spend: 0, save: 0, inc: 0 }, catBud = {};
  for (k = cur - 6; k < cur; k++) {
    if (k < r.lo) continue;
    var ms = monthStats(k);
    if (!ms.n) continue;
    n++;
    tSp += ms.spent; tIn += ms.inc; tSv += ms.saved; tTr += ms.trip;
    Object.keys(ms.cat).forEach(function (c) { catSum[c] = (catSum[c] || 0) + ms.cat[c]; });
    var bk = budgetTotals(k);
    bSum.spend += bk.spend; bSum.save += bk.save; bSum.inc += bk.inc;
    var bmk = bmap(k);
    Object.keys(bmk).forEach(function (c) { if (bmk[c].g !== 'inc') catBud[c] = (catBud[c] || 0) + bmk[c].a; });
  }
  if (n) {
    var bt = { spend: bSum.spend / n, save: bSum.save / n, inc: bSum.inc / n };
    h += '<section class="card"><div class="ghead"><h3>Your typical month</h3><span>avg of last ' + n + ' full months</span></div><div class="kpis">' +
      kpi('Spent', money(tSp / n), 'budget ' + money(bt.spend) + (tTr ? ' · plus ' + money(tTr / n) + ' trips' : '')) + kpi('Income', money(tIn / n), 'planned ' + money(bt.inc)) +
      kpi('Saved', money(tSv / n), 'goal ' + money(bt.save)) + kpi('Net', signed((tIn - tSp - tTr - tSv) / n), 'left over per month') + '</div></section>';

    Object.keys(catBud).forEach(function (c) { if (!catSum[c]) catSum[c] = 0; });
    var rows = Object.keys(catSum).filter(function (c) { return groupOf(c) !== 'save' && (catSum[c] || catBud[c]); }).map(function (c) {
      return { c: c, avg: catSum[c] / n, bud: (catBud[c] || 0) / n };
    }).sort(function (a, b) { return (b.avg - b.bud) - (a.avg - a.bud); });
    h += '<section class="card"><div class="ghead"><h3>Budget reality check</h3><span>avg vs budget</span></div>' +
      '<table class="tb"><tr><th>Category</th><th>Avg</th><th>Budget</th><th>Gap</th></tr>';
    rows.forEach(function (x) {
      var gap = x.avg - x.bud;
      h += '<tr data-act="cat" data-v="' + esc(x.c) + '" data-k="e"><td>' + esc(x.c) + '</td><td>' + money(x.avg) + '</td><td>' + (x.bud ? money(x.bud) : '—') + '</td><td class="' + (gap > 5 ? 'up' : (gap < -5 ? 'down' : '')) + '">' + (Math.abs(gap) < 5 ? 'on target' : (gap > 0 ? '▲ ' : '▼ ') + money(Math.abs(gap))) + '</td></tr>';
    });
    h += '</table><details class="itip"><summary>ⓘ <span>What this means</span></summary><div class="hint">▲ = you usually spend more than budgeted. Trip spending is left out. Budgets are the ones in effect each month. Tap a row for its history.</div></details></section>';
  }
  return h;
}

function kpi(label, val, sub) { return '<div class="kpi"><span>' + label + '</span><b>' + val + '</b><small>' + sub + '</small></div>'; }

function weekStart(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }

function trendWeek() {
  var everyday = function (t) { return t.k === 'e' && t.d && !t.tr && !t.fs && FLEX[groupOf(t.c, ymKey(t.y, t.m))]; };
  var dated = S.tx.filter(everyday);
  var tripDated = S.tx.filter(function (t) { return t.k === 'e' && t.d && t.tr && !t.fs; });
  var bt = budgetTotals();
  var weekly = bt.flex * 12 / 52;
  var ws0 = weekStart(NOW), h = '';
  // which week you're looking at (0 = this week, -1 = last week …) and which 8 weeks the chart shows
  var first = null;
  dated.concat(tripDated).forEach(function (t) { var d = parseD(t.d); if (d && (!first || d < first)) first = d; });
  var minOff = first ? -Math.round((ws0 - weekStart(first)) / (7 * 864e5)) : 0;
  var off = Math.max(minOff, Math.min(0, UI.wk || 0)); UI.wk = off;
  var win = UI.wkWin === undefined ? 0 : Math.min(0, UI.wkWin);
  if (off > win) win = off; if (off < win - 7) win = off;
  UI.wkWin = win; UI.sel.w8 = 7 - (win - off);
  var weeks = [];
  for (var i = 7; i >= 0; i--) { var d = new Date(ws0); d.setDate(d.getDate() + (win - i) * 7); weeks.push({ start: d, sum: 0, trip: 0, items: [] }); }
  function slot(t) { var d = parseD(t.d); if (!d) return null; var w = weekStart(d).getTime(); for (var j = 0; j < weeks.length; j++) if (weeks[j].start.getTime() === w) return weeks[j]; return null; }
  dated.forEach(function (t) { var w = slot(t); if (w) { w.sum += share(t); w.items.push(t); } });
  tripDated.forEach(function (t) { var w = slot(t); if (w) w.trip += share(t); });
  var W = weeks[UI.sel.w8], isCur = off === 0;
  var wEnd = new Date(W.start); wEnd.setDate(wEnd.getDate() + 6);
  var range = MON[W.start.getMonth()] + ' ' + W.start.getDate() + ' – ' + (wEnd.getMonth() !== W.start.getMonth() ? MON[wEnd.getMonth()] + ' ' : '') + wEnd.getDate();
  var title = isCur ? 'This week' : off === -1 ? 'Last week' : 'Week of ' + MON[W.start.getMonth()] + ' ' + W.start.getDate() + (W.start.getFullYear() !== NOW.getFullYear() ? ', ' + W.start.getFullYear() : '');
  var dayN = NOW.getDay() + 1;
  h += '<section class="card wkcard"><div class="calnav"><button data-act="wk" data-v="-1" aria-label="Previous week"' + (off <= minOff ? ' disabled' : '') + '>' + svgChevron(true) + '</button><b>' + title + '</b>' +
    '<button data-act="wk" data-v="1" aria-label="Next week"' + (isCur ? ' disabled' : '') + '>' + svgChevron(false) + '</button></div>' +
    '<div class="eyebrow">' + range + (isCur ? ' · day ' + dayN + ' of 7' : '') + '</div>' +
    '<div class="big' + (W.sum > weekly ? ' neg' : '') + '">' + money(W.sum) + '</div>' +
    '<div class="sub">of about ' + money(weekly) + ' a week for everyday spending' + (W.sum <= weekly ? ' — ' + money(weekly - W.sum) + (isCur ? ' to go' : ' under') : ' — ' + money(W.sum - weekly) + ' over') + (W.trip ? ' · plus ' + money(W.trip) + ' on a trip' : '') + '</div>' +
    '<div class="meter"><i class="' + (W.sum > weekly ? 'over' : '') + '" style="width:' + Math.min(100, weekly ? W.sum / weekly * 100 : 0).toFixed(1) + '%"></i>' + (isCur ? '<b style="left:' + (dayN / 7 * 100).toFixed(1) + '%"></b>' : '') + '</div>' +
    (isCur ? '' : '<button class="linkbtn" data-act="wk" data-v="0" style="margin-top:8px">Back to this week</button>') + '</section>';

  if (!dated.length && !tripDated.length) {
    h += '<div class="card empty"><b>Weekly view fills in as you log</b>Your sheet only records the month for past entries, so weeks start counting from entries added with a date (anything added in this app, or typed into the sheet once the connector is installed).</div>';
    return h;
  }
  var cols = weeks.map(function (w) {
    return { label: (w.start.getMonth() + 1) + '/' + w.start.getDate(), vals: [w.sum + w.trip], trip: w.trip, over: w.sum > weekly,
      info: '<b>Week of ' + MON[w.start.getMonth()] + ' ' + w.start.getDate() + '</b> · ' + money(w.sum) + ' across ' + w.items.length + ' entr' + (w.items.length === 1 ? 'y' : 'ies') + (w.sum > weekly ? ' · over target' : '') + (w.trip ? ' · plus ' + money(w.trip) + ' on a trip' : '') };
  });
  h += '<section class="card"><div class="ghead"><h3>' + (win === 0 ? 'Last 8 weeks' : '8 weeks to ' + MON[weeks[7].start.getMonth()] + ' ' + weeks[7].start.getDate()) + '</h3><span>tap a week</span></div>' + barChart('w8', cols, { line: weekly, lineLabel: 'target ' + money(weekly), legend: ['Everyday'] }) +
    '<details class="itip"><summary>ⓘ <span>What this means</span></summary><div class="hint">Everyday = daily living, going out and one-time. Bills, savings and things paid from savings are left out so a rent week doesn’t look like a splurge. Trip spending is stacked on top and doesn’t count toward the target. Tap a bar or use the arrows to look at that week.</div></details></section>';
  var items = W.items.slice().sort(function (a, b) { return a.d < b.d ? 1 : -1; });
  h += '<section class="card"><div class="ghead"><h3>' + (isCur ? 'This week' : off === -1 ? 'Last week' : 'That week') + '</h3><span>' + items.length + ' entr' + (items.length === 1 ? 'y' : 'ies') + '</span></div>';
  if (!items.length) h += '<div class="hint">No everyday spending logged' + (isCur ? ' yet.' : '.') + '</div>';
  items.forEach(function (t) { h += '<div class="crow"><div class="l1"><b>' + esc(t.v || t.c) + '</b><em>' + money(share(t), true) + '</em></div><div class="l2">' + esc(t.c) + ' · ' + shortDate(t.d) + (+t.ow ? ' · your share' : '') + '</div></div>'; });
  h += '</section>';
  return h;
}

function yearStats(y, upTo) {
  var s = { inc: 0, spent: 0, saved: 0, trip: 0, spentAll: 0, cat: {}, months: 0 };
  for (var m = 0; m <= upTo; m++) {
    var ms = monthStats(ymKey(y, m));
    if (ms.n) s.months++;
    s.inc += ms.inc; s.spent += ms.spent; s.saved += ms.saved; s.trip += ms.trip; s.spentAll += ms.spentAll;
    Object.keys(ms.cat).forEach(function (c) { s.cat[c] = (s.cat[c] || 0) + ms.cat[c]; });
  }
  return s;
}

function trendYear() {
  var r = dataRange(), cy = NOW.getFullYear(), cm = NOW.getMonth();
  var years = [];
  for (var y = ymY(r.lo); y <= cy; y++) years.push(y);
  if (!UI.yr || years.indexOf(UI.yr) < 0) UI.yr = cy;
  var lastFull = cm > 0 ? cm - 1 : 0;
  var y0 = UI.yr, isCur = y0 === cy, upTo = isCur ? lastFull : 11;
  var h = '<div class="ychips">' + years.slice().reverse().map(function (yy) {
    return '<button class="chip' + (yy === y0 ? ' on' : '') + '" data-act="yr" data-v="' + yy + '">' + yy + '</button>';
  }).join('') + '</div>';
  var a = yearStats(y0, upTo), b = yearStats(y0 - 1, upTo);
  var span = isCur ? (upTo === 0 ? 'January' : 'Jan–' + MON[upTo]) + ' (complete months)' : 'full year';
  function vs(x, yv, goodUp) {
    if (!b.months) return 'no ' + (y0 - 1) + ' data';
    var d = x - yv, cls = Math.abs(d) < 1 ? '' : ((d > 0) === goodUp ? 'down' : 'up');
    return '<span class="' + cls + '">' + (d >= 0 ? '+' : '−') + money(Math.abs(d)) + '</span> vs ' + (y0 - 1);
  }
  h += '<section class="card"><div class="ghead"><h3>' + y0 + '</h3><span>' + span + '</span></div><div class="kpis">' +
    kpi('Income', money(a.inc), vs(a.inc, b.inc, true)) + kpi('Spent', money(a.spentAll), vs(a.spentAll, b.spentAll, false) + (a.trip ? '<br>incl. ' + money(a.trip) + ' trips' : '')) +
    kpi('Saved', money(a.saved), vs(a.saved, b.saved, true)) + kpi('Net', signed(a.inc - a.spentAll - a.saved), vs(a.inc - a.spentAll - a.saved, b.inc - b.spentAll - b.saved, true)) +
    '</div></section>';

  var cols = years.map(function (yy) {
    var s = yearStats(yy, yy === cy ? lastFull : 11), n = Math.max(1, s.months);
    return { label: "'" + String(yy).slice(2), vals: [s.spentAll / n, s.inc / n], trip: s.trip / n,
      info: '<b>' + yy + (yy === cy ? ' so far' : '') + '</b> · average month: spent ' + money(s.spentAll / n) + (s.trip ? ' (' + money(s.trip / n) + ' trips)' : '') + ', income ' + money(s.inc / n) + ' (' + s.months + ' month' + (s.months === 1 ? '' : 's') + ' of data)' };
  });
  UI.sel.years = UI.sel.years === undefined ? years.indexOf(y0) : UI.sel.years;
  h += '<section class="card"><div class="ghead"><h3>Average month, by year</h3></div>' + barChart('years', cols, { legend: ['Spent', 'Income'] }) +
    '<details class="itip"><summary>ⓘ <span>What this means</span></summary><div class="hint">Averages keep partial years fair. Older years come from the yearly tabs, so they may group spending differently.</div></details></section>';

  // Year-to-date per category vs budget: smooths out lumpy bills like car insurance.
  var monthsN = upTo + 1;
  var ybud = {};
  for (var mm = 0; mm <= upTo; mm++) {
    var bmm = bmap(ymKey(y0, mm));
    Object.keys(bmm).forEach(function (c) { if (bmm[c].g !== 'inc') ybud[c] = (ybud[c] || 0) + bmm[c].a; });
  }
  Object.keys(ybud).forEach(function (c) { if (a.cat[c] === undefined) a.cat[c] = 0; });
  var rows = Object.keys(a.cat).map(function (c) { return { c: c, act: a.cat[c], bud: ybud[c] || 0, g: groupOf(c) }; })
    .filter(function (x) { return x.g !== 'save' && (x.act || x.bud); })
    .sort(function (p, q) { return (q.act - q.bud) - (p.act - p.bud); });
  if (rows.length && y0 >= cy - 1) {
    h += '<section class="card"><div class="ghead"><h3>' + (isCur ? 'Year to date' : 'Full year') + ' vs budget</h3><span>' + monthsN + ' months of budget</span></div>' +
      '<table class="tb"><tr><th>Category</th><th>Actual</th><th>Budget</th><th>Gap</th></tr>';
    rows.forEach(function (x) {
      var gap = x.act - x.bud;
      h += '<tr data-act="cat" data-v="' + esc(x.c) + '" data-k="e"><td>' + esc(x.c) + '</td><td>' + money(x.act) + '</td><td>' + (x.bud ? money(x.bud) : '—') + '</td><td class="' + (gap > 10 ? 'up' : (gap < -10 ? 'down' : '')) + '">' + (gap >= 0 ? '+' : '−') + money(Math.abs(gap)) + '</td></tr>';
    });
    h += '</table><details class="itip"><summary>ⓘ <span>What this means</span></summary><div class="hint">Budget = each month’s budget added up, so mid-year changes count from when they started. Big one-off bills (like a 6-month insurance payment) even out here.</div></details></section>';
  }
  if (isCur) h += '<section class="card" id="plan_proj">' + planProjHtml() + '</section><section class="card" id="plan_year">' + planYearHtml() + '</section>';
  return h;
}

// ------------------------------------------------------------------ sheets (add, settings, category)
var SHEET = null;

// While a sheet is open the page behind it is pinned, so scrolling only moves the sheet.
var LOCKY = 0;
function lockPage(on) {
  var b = document.body;
  if (on && !b.classList.contains('locked')) { LOCKY = window.scrollY; b.style.top = -LOCKY + 'px'; b.classList.add('locked'); }
  if (!on && b.classList.contains('locked')) { b.classList.remove('locked'); b.style.top = ''; window.scrollTo(0, LOCKY); }
}

function openSheet(kind, arg) {
  SHEET = { kind: kind, arg: arg };
  UI.catTouched = false; UI.tripTouched = false; UI.catAuto = false;
  if (kind === 'settings') UI.open = {};      // every visit starts with the sections closed
  if (kind === 'add') UI.split = null;
  if (kind === 'settings') UI.alertMsg = '';
  renderSheet();
  lockPage(true);
  $('sheet').style.transform = '';
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
  $('sheet').scrollTop = 0;
  if (kind === 'add') {
    var fa = $('f_a');
    if (fa) try { fa.focus({ preventScroll: true }); } catch (e) {}
    setTimeout(function () { var a = $('f_a'); if (a && document.activeElement !== a) try { a.focus({ preventScroll: true }); } catch (e) {} }, 260);
  }
}

function closeSheet() {
  SHEET = null;
  CLOSED_AT = Date.now();
  playPending();
  unfitSheet();
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
  $('sheet').style.transform = '';
  $('scrim').style.opacity = '';
  lockPage(false);
}

// Pull the page down from the very top to sync.
(function () {
  var y0 = null, armed = false, ind = null;
  function el() {
    if (!ind) { ind = document.createElement('div'); ind.id = 'ptr'; ind.innerHTML = '<span></span>'; document.body.appendChild(ind); }
    return ind;
  }
  document.addEventListener('touchstart', function (e) {
    if (SHEET || PICK || window.scrollY > 0 || e.touches.length !== 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; armed = false;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (y0 === null) return;
    var d = e.touches[0].clientY - y0;
    if (d < 0 || window.scrollY > 0) { y0 = null; el().className = ''; return; }
    var p = el(); p.className = 'show' + (d > 80 ? ' ready' : '');
    p.style.transform = 'translate(-50%,' + Math.min(70, d / 2) + 'px)';
    p.firstChild.textContent = d > 80 ? 'Release to sync' : 'Pull to sync';
    armed = d > 80;
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (y0 === null) return;
    y0 = null;
    var p = el(); p.className = ''; p.style.transform = '';
    if (armed) { armed = false; if (S.demo) toast('Connect your sheet in Settings to sync'); else { sync(); toast('Syncing…'); } }
  });
})();

// Swipe a sheet down to close it: drag from the handle, or anywhere once it's scrolled to the top.
(function () {
  var sh = null, y0 = 0, x0 = 0, t0 = 0, dy = 0, active = false, decided = false;
  function el() { return sh || (sh = $('sheet')); }
  document.addEventListener('touchstart', function (e) {
    var s = el();
    if (!SHEET || !s.contains(e.target) || e.touches.length !== 1) return;
    var tag = e.target.tagName;
    if (/INPUT|SELECT|TEXTAREA/.test(tag) && !e.target.closest('.grab')) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; t0 = Date.now(); dy = 0;
    active = s.scrollTop <= 0 || !!e.target.closest('.grab, .shead');
    decided = false;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!active) return;
    var s = el(), d = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (!decided) {
      if (Math.abs(d) < 6 && dx < 6) return;
      decided = true;
      if (d <= 0 || dx > Math.abs(d)) { active = false; return; }   // scrolling up or sideways: let it scroll
    }
    dy = Math.max(0, d);
    e.preventDefault();
    s.style.transition = 'none';
    s.style.transform = 'translateY(' + dy + 'px)';
    $('scrim').style.opacity = String(Math.max(0, 1 - dy / 400));
  }, { passive: false });
  document.addEventListener('touchend', function () {
    if (!active) return;
    active = false;
    var s = el(), fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
    s.style.transition = '';
    if (dy > 110 || fast) closeSheet();
    else { s.style.transform = ''; $('scrim').style.opacity = ''; }
  });
})();

function renderSheet() {
  if (!SHEET) return;
  var h = '<div class="grab"></div>';
  if (SHEET.kind === 'add') {

      : op.op === 'prefs' ? { action: 'prefs', prefs: prefsObj() }
      : { action: op.op, tx: op.tx, ref: op.ref };
    var sentPrefs = op.op === 'prefs' ? prefsHash() : '';
    return api(payload).then(function (res) {
      if (!res || !res.ok) {
        var e = (res && res.error) || 'unknown';
        if (e === 'unknown_action') {
          S.outbox.shift();
          toast('Your sheet\u2019s script is out of date — paste the new Code.gs and deploy a new version.');
          save();
          return next();
        }
        if (e === 'not_found' || e === 'bad_entry' || e === 'no_budget_tabs' || /validation/i.test(e)) {
          S.outbox.shift();                               // can't ever succeed: drop it and say so
          toast(e === 'not_found' ? 'A change couldn’t be matched to a sheet row (it was edited there). Skipped.' : 'The sheet rejected a change: ' + e);
          save();
          return next();
        }
        throw new Error(e);
      }
      // settings changed again while they were being sent: send the newer ones too
      if (!(op.op === 'prefs' && prefsHash() !== sentPrefs)) S.outbox.shift();
      save();
      return next();
    });
  }
  return next().then(function () { return api({ action: 'pull' }); }).then(function (data) {
    if (!data || !data.ok) throw new Error((data && data.error) || 'pull_failed');
    applyPull(data);
    S.syncErr = (data.v || 1) < 6 ? 'Your sheet has an older connector. Paste the new Code.gs and deploy a new version (see setup) for trips, trip budgets, budget updates and the timezone fix.' : '';
    S.lastSync = Date.now();
    save();
    SYNCING = false;
    safeRender();
    if (S.outbox.length) flushSoon();
    return true;
  }).catch(function (e) {
    SYNCING = false;
    S.syncErr = errText(e);
    save();
    renderSync(); if (SHEET && SHEET.kind === 'settings') renderSheet();
    return false;
  });
}

// ---- your settings, copied to the sheet's "app settings" tab so a reinstall gets them back
var PREF_KEYS = ['pal', 'mode', 'style', 'corners', 'cards', 'density', 'icon', 'iconc', 'appname', 'fsize', 'launchAdd'];
function prefsObj() {
  var cfg = {};
  PREF_KEYS.forEach(function (k) { cfg[k] = S.cfg[k]; });
  return { cfg: cfg, order: orderState(), catGroup: S.catGroup || {}, alerts: alertState(), yearly: S.yearly || {}, roll: S.roll || {}, hideV: S.hideV || {}, pay: S.pay || null, at: S.prefsAt || 0 };
}
function prefsHash() { var p = prefsObj(); delete p.at; return JSON.stringify(p); }
function queuePrefs() {
  if (S.demo || (S.scriptV || 0) < 10 || !S.prefsPulled) return;
  var ph = prefsHash();
  if (ph === S.prefsSent) return;
  S.prefsSent = ph; S.prefsAt = Date.now();
  if (!S.outbox.some(function (op) { return op.op === 'prefs'; })) S.outbox.push({ oid: nid('o'), op: 'prefs' });
  save();
}
function adoptPrefs(p) {
  var c = p.cfg || {};
  if (PALETTES[c.pal]) S.cfg.pal = c.pal;
  if (/^(auto|light|dark)$/.test(c.mode)) S.cfg.mode = c.mode;
  if (STYLES[c.style]) S.cfg.style = c.style;
  if (CORNERS[c.corners]) S.cfg.corners = c.corners;
  if (CARDS[c.cards]) S.cfg.cards = c.cards;
  if (DENSITY[c.density]) S.cfg.density = c.density;
  if (FSIZE[c.fsize]) S.cfg.fsize = c.fsize;
  if (ICONS[c.icon]) S.cfg.icon = c.icon;
  if (ICON_COLORS[c.iconc]) S.cfg.iconc = c.iconc;
  if (c.appname) S.cfg.appname = String(c.appname).slice(0, 14);
  if (p.order && typeof p.order === 'object') S.order = p.order;
  if (p.catGroup && typeof p.catGroup === 'object') S.catGroup = p.catGroup;
  if (p.alerts && typeof p.alerts === 'object') S.alerts = p.alerts;
  if (p.yearly && typeof p.yearly === 'object') S.yearly = p.yearly;
  if (p.roll && typeof p.roll === 'object') S.roll = p.roll;
  if (p.hideV && typeof p.hideV === 'object') S.hideV = p.hideV;
  if (p.pay === null || (p.pay && typeof p.pay === 'object')) S.pay = p.pay;
  S.cfg.launchAdd = !!c.launchAdd;
  S.prefsAt = p.at || 0;
  S.prefsSent = prefsHash();
  try { applyTheme(); } catch (e) {}
}

// Replaces local data with the sheet's, then re-applies anything still waiting to be sent.
function applyPull(data) {
  var tx = (data.tx || []).map(function (a) {
    return { id: 's' + a[0] + a[1] + '_' + a[3], k: a[0], y: a[1], m: a[2], r: a[3], v: a[4], c: a[5], a: a[6], n: a[7], d: a[8], tr: a[9] || '',
      fs: a[10] || '', ow: +a[11] || 0, pb: a[12] || '',
      o: { k: a[0], y: a[1], m: a[2], v: a[4], c: a[5], a: a[6] } };
  });
  S.outbox.forEach(function (op) {
    if (op.op === 'add') { var t = pick(op.tx); t.id = op.tid; t.r = 0; t.p = 1; tx.push(t); return; }
    if (op.op === 'tag') {
      (op.refs || []).forEach(function (r) { var h1 = matchRef(tx, r); if (h1) h1.tr = op.trip; });
      (op.untag || []).forEach(function (r) { var h2 = matchRef(tx, r); if (h2) h2.tr = ''; });
      return;
    }
    if (!op.ref) return;
    var hit = matchRef(tx, op.ref);
    if (!hit) return;
    if (op.op === 'delete') tx.splice(tx.indexOf(hit), 1);
    else { Object.keys(op.tx).forEach(function (k) { hit[k] = op.tx[k]; }); hit.p = 1; op.tid = hit.id; }
    if (op.op === 'delete') op.tid = hit.id;
  });
  if (UI.edit) {
    var old = findTx(UI.edit), now = null;
    if (old) {
      for (var i = 0; i < tx.length && !now; i++) if (tx[i].id === old.id) now = tx[i];
      if (!now && old.o) now = matchRef(tx, refOf(old));
    }
    UI.edit = now ? now.id : null;
  }
  S.tx = tx;
  S.grids = data.grids || [];
  if (data.budget) {
    S.budget = data.budget.map(function (b) { return { s: b[0], g: b[1], c: b[2], a: b[3], row: b[4], n: b[5] || '' }; });
    S.outbox.forEach(function (op) {
      if (op.op === 'budget') applyBudgetOp(S.budget, op.b);
      if (op.op === 'budgets') op.list.forEach(function (b) { applyBudgetOp(S.budget, b); });
    });
  }
  S.scriptV = data.v || 1;
  S.seed = data.seed || null;
  if (data.trips) {
    S.trips = data.trips.map(function (t) { return { name: t[0], start: t[1], end: t[2], budget: +t[3] || 0, notes: t[4] || '', row: t[5], plan: parseTripPlan(t[6]) }; });
    S.outbox.forEach(function (op) { if (op.op === 'trip') applyTripOp(op); if (op.op === 'tripdel') removeTripLocal(op.name); });
  }
  if (data.recur) {
    S.recur = data.recur.map(function (b) { return { name: b[0], c: b[1], a: +b[2] || 0, day: +b[3] || 1, auto: !!b[4], notes: b[5] || '' }; });
    S.outbox.forEach(function (op) {
      if (op.op === 'recur') recurOp(op.bill, op.old);
      if (op.op === 'recurdel') S.recur = S.recur.filter(function (b) { return low(b.name) !== low(op.name); });
    });
  }
  if (data.goals) {
    S.goals = data.goals.map(function (g) { return { name: g[0], target: +g[1] || 0, by: g[2] === null ? nowYM() + 12 : +g[2], c: g[3] || '', base: +g[4] || 0, start: g[5] === null ? nowYM() : +g[5], notes: g[6] || '' }; });
    S.outbox.forEach(function (op) {
      if (op.op === 'goal') goalOp(op.goal, op.old);   // (celebrations run after the pull)
      if (op.op === 'goaldel') S.goals = S.goals.filter(function (g) { return low(g.name) !== low(op.name); });
    });
  }
  if (data.prefs && !S.outbox.some(function (op) { return op.op === 'prefs'; }) && (+data.prefs.at || 0) > (S.prefsAt || 0)) adoptPrefs(data.prefs);
  // hidden suggestions saved from another device (or by an older version that didn't know about them)
  if (data.prefs && data.prefs.hideV && typeof data.prefs.hideV === 'object' && !S.hideV) S.hideV = data.prefs.hideV;
  if (data.prefs && data.prefs.pay && typeof data.prefs.pay === 'object' && S.pay === undefined) S.pay = data.prefs.pay;
  if ((data.v || 0) >= 10) S.prefsPulled = 1;
  CACHE = {}; VER++;
  setTimeout(autoLogRecur, 0);
}

// Don't wipe out a form the person is in the middle of filling in.
function safeRender() {
  var ae = document.activeElement;
  var typingInSheet = SHEET && ae && $('sheet').contains(ae) && /INPUT|SELECT|TEXTAREA/.test(ae.tagName);
  if (UI.edit && $('txform') && $('view').contains($('txform'))) {
    $('txform').setAttribute('data-id', UI.edit);
    renderSync();
  } else keepScroll(render);
  if (SHEET && SHEET.kind !== 'add' && !typingInSheet) renderSheet();
}

function matchRef(list, ref) {
  var best = null;
  list.forEach(function (t) {
    if (!t.o || t.o.k !== ref.k || t.o.y !== ref.y) return;
    if (t.o.m !== ref.fp.m || t.o.v !== ref.fp.v || t.o.c !== ref.fp.c || Math.abs(t.o.a - ref.fp.a) > 0.005) return;
    if (!best || Math.abs(t.r - ref.r) < Math.abs(best.r - ref.r)) best = t;
  });
  return best;
}

function connect() {
  var url = $('c_url').value.trim(), pass = $('c_pass').value;
  var btn = $('c_go');
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { S.syncErr = 'That doesn’t look like an Apps Script web app URL (it starts with https://script.google.com/).'; renderSheet(); return; }
  lock('connect', function () {
    btn.disabled = true; btn.textContent = 'Connecting…';
    var prev = { url: S.cfg.url, pass: S.cfg.pass };
    S.cfg.url = url; S.cfg.pass = pass;
    return api({ action: 'ping' }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || 'no_response');
      S.scriptV = res.v || 1;
      if (S.demo) { S.demo = false; S.tx = []; S.outbox = []; S.grids = []; S.plan = null; S.trips = []; }
      S.syncErr = '';
      save();
      return sync().then(function (ok) { if (ok) toast('Connected to “' + res.name + '”'); });
    }).catch(function (e) {
      if (S.demo) { S.cfg.url = prev.url; S.cfg.pass = prev.pass; }
      S.syncErr = errText(e);
      save();
      renderSheet();
    });
  });
}

function disconnect() {
  if (UI.armed !== 'disc') { arm('disc', document.querySelector('[data-act=disconnect]'), 'Sure? Tap again'); return; }
  UI.armed = null;

// Two-step confirm: first tap arms, second confirms, disarms after 3 s.
var armTimer = null;
function arm(key, btn, label) {
  UI.armed = key;

  clearTimeout(armTimer);
  armTimer = setTimeout(function () {
    UI.armed = null;

  }, 3000);

// Same rules as the sheet script (setBudget_): from / month / year / fix, and remove.
function applyBudgetOp(list, b) {
  var want = low(b.c), s = +b.s, mode = b.mode || 'from', a = b.remove ? 0 : +b.a, note = b.remove ? 'removed' : (b.note || '');
  function mine() { return list.filter(function (r) { return low(r.c) === want; }); }
  function at(k) { var best = null; mine().forEach(function (r) { if (r.s <= k && (!best || r.s >= best.s)) best = r; }); return best; }
  var was = at(s), rows = mine();
  var g = b.g || (was && was.g) || (rows[0] && rows[0].g) || 'one-time';
  function put(k, gg, aa, nn) {
    var t = null;
    mine().forEach(function (r) { if (r.s === k) t = r; });
    if (t) { t.a = aa; t.g = gg; t.n = nn || (/^from /i.test(t.n || '') || t.n === 'removed' ? 'changed in app' : t.n); }
    else list.push({ s: k, g: gg, c: b.c, a: aa, row: 0, n: nn || '' });
  }
  if (mode === 'fix') {
    var t = was;
    if (!t) rows.forEach(function (r) { if (!t || r.s < t.s) t = r; });
    if (t) { t.a = a; t.g = g; if (note) t.n = note; } else put(s, g, a, note);
    return;
  }
  if (mode === 'year') {
    var y0 = Math.floor(s / 12) * 12;
    for (var i = list.length - 1; i >= 0; i--) { var r = list[i]; if (low(r.c) === want && r.s > y0 && r.s <= y0 + 11) list.splice(i, 1); }
    put(y0, g, a, note);
    return;
  }
  if (mode === 'month') {
    put(s, g, a, note);
    if (!mine().some(function (r2_) { return r2_.s === s + 1; })) put(s + 1, was ? was.g : g, was ? was.a : 0, was ? 'back after ' + MON[s % 12].toLowerCase() : 'removed');
    return;
  }
  put(s, g, a, note);
}

function budgetChange(b) {
  applyBudgetOp(S.budget, b);
  if (!S.demo) {
    for (var j = S.outbox.length - 1; j >= 0; j--) {
      var o = S.outbox[j];
      if (o.op === 'budget' && low(o.b.c) === low(b.c) && o.b.mode === b.mode && o.b.s === b.s) S.outbox.splice(j, 1);
    }
    S.outbox.push({ oid: nid('o'), op: 'budget', b: b });
  }
  save();
}

function addCategory(name, gid, amt, startKey) {
  name = low(name);

  budgetChange({ mode: 'from', s: startKey, g: GROUP_NAME[gid] || 'one-time', c: name, a: isNaN(amt) ? 0 : amt });

}

// ------------------------------------------------------------------ backup
function exportData() {
  var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'runway-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function importData(file) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.tx) || !d.cfg) throw new Error('bad');
      S = migrate(d);
      save(); applyTheme(); render(); renderSheet();
      toast('Backup restored');
      flushSoon();
    } catch (e) { toast('That file isn’t a Runway backup.'); }
  };
  rd.readAsText(file);
}

function migrate(d) {
  var f = fresh();
  Object.keys(f).forEach(function (k) { if (d[k] === undefined) d[k] = f[k]; });
  Object.keys(f.cfg).forEach(function (k) { if (d.cfg[k] === undefined) d.cfg[k] = f.cfg[k]; });
  if (!PALETTES[d.cfg.pal]) d.cfg.pal = PAL_MOVE[d.cfg.pal] || 'coastline';
  if (!Array.isArray(d.trips)) d.trips = [];
  if (!Array.isArray(d.recur)) d.recur = [];
  if (!d.cfg.v22) { d.cfg.v22 = 1; d.cfg.icon = 'piggy'; d.cfg.iconc = 'gold'; d.cfg.appname = 'Piggy'; }
  if (!d.recurDone) d.recurDone = {};
  if (!d.order || typeof d.order !== 'object') d.order = { groups: [], cats: {} };
  if (!d.catGroup || typeof d.catGroup !== 'object') d.catGroup = {};
  if (!Array.isArray(d.goals)) d.goals = [];
  if (!d.recapSeen) d.recapSeen = {};
  if (!d.alerts || typeof d.alerts !== 'object') d.alerts = { on: false };
  if (!d.yearly || typeof d.yearly !== 'object') d.yearly = {};
  if (!d.roll || typeof d.roll !== 'object') d.roll = {};
  if (!FSIZE[d.cfg.fsize]) d.cfg.fsize = 'm';
  // 1.4 kept the preview's sample "Japan" trip after connecting; drop it (it was never in the sheet)
  if (!d.demo) d.trips = d.trips.filter(function (t) { return !(t.name === 'Japan' && t.start === '2025-11-28' && t.notes === 'tokyo + osaka' && !t.row); });
  if (!STYLES[d.cfg.style]) d.cfg.style = 'classic';
  if (!CORNERS[d.cfg.corners]) d.cfg.corners = 'soft';
  if (!CARDS[d.cfg.cards]) d.cfg.cards = 'outline';
  if (!DENSITY[d.cfg.density]) d.cfg.density = 'comfy';
  // v1 budgets had no starting month: treat them as always in effect
  d.budget = (d.budget || []).map(function (b) { return b.s === undefined ? { s: 0, g: b.sec || b.g || '', c: b.c, a: b.a, row: b.row } : b; });
  d.outbox = (d.outbox || []).map(function (o) {
    return o.op === 'budget' && !o.b ? { oid: o.oid, op: 'budget', b: { mode: 'fix', s: nowYM(), g: '', c: o.label, a: o.value } } : o;
  });
  return d;
}

// ------------------------------------------------------------------ events
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  switch (act) {

      // Activity starts clean each time you come back to it
      if (v === 'activity' && UI.tab !== 'activity') { UI.q = ''; UI.am = ''; UI.asort = 'new'; UI.fk = 'all'; UI.lim = 120; }
      UI.tab = v; UI.edit = null; if (SHEET) closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'goplan':
      if (SHEET) closeSheet();
      var gp = planState();
      if (v) { gp.mode = 'from'; gp.key = Math.max(nowYM(), +v); }
      gp.step = 'edit';
      UI.tab = 'plan'; UI.edit = null; render(); window.scrollTo(0, 0);

    case 'pcatfrom':                                    // "Change budget" from a category's popup
      var pf = planState(), fk = UI.ym === null ? nowYM() : UI.ym;
      // with unsaved changes open, stay in them; otherwise edit the month you were looking at

      pf.step = 'edit'; UI.popen = {}; UI.popen[planGroup(v)] = true;
      UI.tab = 'plan'; render(); window.scrollTo(0, 0);
      openSheet('pcat', v);
      break;
    case 'recur': openSheet('recur'); break;
    case 'recurmonth': openSheet('recurmonth', +v); break;
    case 'heroexp': UI.heroOpen = !UI.heroOpen; keepScroll(render); break;
    case 'gmove':
      var gids = userGroupIds(), gi2 = gids.indexOf(v), gd = +el.getAttribute('data-d');
      if (gi2 < 0 || gi2 + gd < 0 || gi2 + gd >= gids.length) break;
      gids.splice(gi2, 1); gids.splice(gi2 + gd, 0, v);
      orderState().groups = gids; save(); renderSheet(); break;
    case 'cmove':
      var cg = el.getAttribute('data-g'), clist = catOrderCats(cg), ci = clist.indexOf(v), cd = +el.getAttribute('data-d');
      if (ci < 0 || ci + cd < 0 || ci + cd >= clist.length) break;

      orderState().cats[cg] = clist; save(); renderSheet(); break;
    case 'oreset':

      toast('Back to the usual order', function () { S.order = JSON.parse(oldOrder); save(); renderSheet(); render(); });
      render(); break;
    case 'pkeep':
      var PK = planState(), ky = ymY(PK.key);
      if (S.demo) { toast('Connect your sheet to save a ' + ky + ' budget tab.'); break; }
      if ((S.scriptV || 0) < 10) { toast('Update the script in your sheet first (Code.gs version 10).'); break; }
      S.outbox = S.outbox.filter(function (op) { return !(op.op === 'yeartab' && op.y === ky); });
      S.outbox.push({ oid: nid('o'), op: 'yeartab', y: ky });
      PK.step = 'home'; UI.popen = {}; save(); render(); window.scrollTo(0, 0);
      toast(ky + ' budget saved — same amounts as now');
      flushSoon(); break;
    case 'mgrp':
      S.mopen = S.mopen || {};
      var gopen = el.getAttribute('aria-expanded') !== 'true';
      S.mopen[v] = gopen; save();
      var gsec = el.parentNode;                         // open/close in place so it can animate
      gsec.classList.toggle('open', gopen); el.setAttribute('aria-expanded', gopen);
      var gchev = el.querySelector('.chev'); if (gchev) gchev.classList.toggle('up', gopen);
      break;
    case 'recuredit': openSheet('recuredit', { name: v || '' }); break;
    case 'recursug': var sg = recurSuggestions()[+v]; if (sg) openSheet('recuredit', { name: '', preset: sg }); break;
    case 'rcauto': e.preventDefault(); el.classList.toggle('on'); var rco = el.classList.contains('on'); el.setAttribute('aria-pressed', rco); el.textContent = (rco ? '✓ ' : '') + 'Log it automatically on its day'; break;

      break;
    case 'recurlog':
      lock('recurlog', function () {
        var rb = recurByName(v); if (!rb) return;

var TAPF = null;
document.addEventListener('touchstart', function (e) {
  var el = e.target, sh = $('sheet');
  TAPF = null;
  if (!SHEET || !sh || !sh.classList.contains('kb') || e.touches.length !== 1) return;
  if (el.tagName !== 'INPUT' || el.type !== 'text' || el === document.activeElement || !sh.contains(el)) return;
  TAPF = { el: el, x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  if (TAPF && Math.abs(e.touches[0].clientX - TAPF.x) + Math.abs(e.touches[0].clientY - TAPF.y) > 8) TAPF = null;
}, { passive: true });
document.addEventListener('touchend', function (e) {
  var f = TAPF; TAPF = null;
  if (!f || e.target !== f.el) return;
  e.preventDefault();
  try { f.el.focus({ preventScroll: true }); var n = f.el.value.length; f.el.setSelectionRange(n, n); } catch (er) {}
  refitSoon();
}, { passive: false });
document.addEventListener('focusout', function (e) { var sh = $('sheet'); if (SHEET && sh && sh.contains(e.target)) refitSoon(); });

// Works offline and opens instantly: a service worker keeps a copy of the app on the phone.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'updated') toast('A new version of ' + appName() + ' is ready', function () { location.reload(); }, 'Reload');
  });
  if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
}

// Tap a message (not its Undo) to put it away right away.
document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'toastTxt') { clearTimeout(toastTimer); $('toast').classList.remove('on'); UNDO = null; }
});

// ---- press and hold a name suggestion to stop suggesting it
var HOLD = null, HELD = false;
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest ? e.target.closest('#f_sugg button') : null;
  HELD = false;
  if (!b) return;
  HOLD = { b: b, x: e.clientX, y: e.clientY, t: setTimeout(function () {
    var v = b.getAttribute('data-v'), f = $('txform'); if (!f) return;
    var kind = f.querySelector('.seg .on').getAttribute('data-v');
    HELD = true; HOLD = null;
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (er) {}
    hideVendor(kind, v, true); suggest();
    toast('“' + v + '” won’t be suggested', function () { hideVendor(kind, v, false); suggest(); });
  }, 550) };
});
['pointerup', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, function () { if (HOLD) { clearTimeout(HOLD.t); HOLD = null; } }); });
document.addEventListener('pointermove', function (e) { if (HOLD && Math.abs(e.clientX - HOLD.x) + Math.abs(e.clientY - HOLD.y) > 10) { clearTimeout(HOLD.t); HOLD = null; } });
document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('#f_sugg')) e.preventDefault(); });
document.addEventListener('click', function (e) {     // a hold isn't a tap
  if (HELD) { HELD = false; if (e.target.closest && e.target.closest('#f_sugg')) { e.stopPropagation(); e.preventDefault(); } }
}, true);

// ---- swiping Activity rows
var SW = null, SWIPED_AT = 0;
document.addEventListener('touchstart', function (e) {
  var row = e.target.closest ? e.target.closest('.swipe') : null;
  if (!row || UI.bulk || UI.edit === row.getAttribute('data-id') || e.touches.length !== 1) { SW = null; return; }
  SW = { row: row, btn: row.querySelector('.tx'), x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, axis: null };
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  if (!SW) return;
  var dx = e.touches[0].clientX - SW.x, dy = e.touches[0].clientY - SW.y;
  if (!SW.axis) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; SW.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y'; }
  if (SW.axis !== 'x') return;
  e.preventDefault();
  SW.dx = dx;
  var w = SW.row.offsetWidth, lim = w * 0.6, show = Math.max(-w, Math.min(w, dx));
  if (Math.abs(show) > lim) show = (show > 0 ? 1 : -1) * (lim + (Math.abs(show) - lim) * 0.35);   // a little resistance at the end
  SW.row.classList.add('moving'); SW.row.classList.toggle('l', dx < 0); SW.row.classList.toggle('r', dx > 0);
  SW.row.classList.toggle('go', Math.abs(dx) > 90);
  SW.btn.style.transform = 'translateX(' + show + 'px)';
}, { passive: false });
document.addEventListener('touchend', function () {
  if (!SW) return;
  var sw = SW; SW = null;
  sw.row.classList.remove('moving');
  if (sw.axis !== 'x') return;
  SWIPED_AT = Date.now();
  var id = sw.row.getAttribute('data-id'), t = findTx(id);
  S.tips = S.tips || {};
  if (!S.tips.swipe) { S.tips.swipe = 1; save(); }
  if (sw.dx < -90 && t) {
    sw.btn.style.transform = 'translateX(-100%)';
    sw.row.style.maxHeight = sw.row.offsetHeight + 'px';
    setTimeout(function () { sw.row.classList.add('gone'); }, 160);
    setTimeout(function () {
      lock('save', function () {
        var copy = deleteTx(id);
        keepScroll(render);
        if (copy) toast('Deleted ' + money(copy.a, true) + ' · ' + copy.c, { type: 'delete', tx: copy });
        flushSoon();
      });
    }, 380);
    return;
  }
  sw.btn.style.transform = '';
  setTimeout(function () { sw.row.classList.remove('l', 'r', 'go'); }, 230);
  if (sw.dx > 90 && t) { UI.bulk = {}; UI.bulk[id] = true; UI.bulkOne = true; openSheet('bulk'); }
});
document.addEventListener('click', function (e) {     // a swipe isn't a tap
  if (Date.now() - SWIPED_AT < 400 && e.target.closest && e.target.closest('.swipe')) { e.stopPropagation(); e.preventDefault(); }
}, true);

// Back after a while with "Quick add" on: open a new entry.
var HIDDEN_AT = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { HIDDEN_AT = Date.now(); return; }
  if (S && S.cfg.launchAdd && HIDDEN_AT && Date.now() - HIDDEN_AT > 5 * 60000 && !SHEET && !UI.edit && !PICK) openSheet('add', newTxDraft('e'));
});

// test hook
window.__runway = { planTotals: function (k) { return planTotals(k); }, get S() { return S; }, UI: UI, sync: sync, applyPull: applyPull, monthStats: monthStats, budgetTotals: budgetTotals, render: render, save: function () { return save(); }, fitSheet: fitSheet, get FULLH() { return FULLH; }, setNow: function (d) { FIXED_NOW = d; NOW = d; } };

boot();
})();
</script>
</body>
</html>
