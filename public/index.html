<style>
:root{
  --bg:#f4f1ea;--p1:#fffdf8;--p2:#ece7dc;--b1:#e2dccf;--b2:#cfc7b6;
  --t1:#1d1b17;--t2:#57524a;--t3:#7a7368;
  --ac:#0f6b62;--acd:#d6ebe7;--bf:#ffffff;--ok:#2f7a35;--bad:#b3261e;--warn:#9a5b00;
  --s1:#0f6b62;--s2:#b4882e;
  --fdisp:'Fraunces',Georgia,serif;--fbody:'DM Sans',system-ui,-apple-system,sans-serif;
  --r:16px;--r2:12px;--cb:#e2dccf;--csh:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--fbody);font-size:15px;line-height:1.4;
  max-width:100%;overflow-x:hidden;overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit;max-width:100%}
input,select,textarea{font-size:16px;min-width:0;box-sizing:border-box}
html[data-density=compact] input,html[data-density=compact] select,html[data-density=compact] textarea{font-size:16px}
/* iOS renders a wide native date control; keep it inside its box and left-aligned */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;
  min-height:44px;line-height:normal;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-width:0}
input[type=date]::-webkit-datetime-edit{padding:0}
input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto;flex-shrink:0}
input[type=search]{-webkit-appearance:none;appearance:none}
/* grid and flex children shrink instead of forcing their parent wider */
.row2>*,.field,.kpis>*,.stats>*,.pkgrid>*,.stylegrid>*,.swatches>*,.seg>*,.chips>*,.cchips>*,.quick>*{min-width:0}
button{cursor:pointer;border:0;background:none;padding:0}
.num,.amt,.big,.stat b,.mono{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
.brand{font-family:var(--fdisp);font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);padding:6px 10px;border-radius:999px;background:var(--p2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t3)}
.dot.ok{background:var(--ok)}.dot.wait{background:var(--warn)}.dot.err{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:var(--r2);display:grid;place-items:center;color:var(--t2)}
.icon-btn svg{width:22px;height:22px}
main{padding:0 16px 72px}
.card{background:var(--p1);border:1px solid var(--cb);box-shadow:var(--csh);border-radius:var(--r);padding:16px;margin:0 0 12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:600}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.mbar button{width:40px;height:40px;border-radius:var(--r2);background:var(--p2);display:grid;place-items:center;color:var(--t2)}
.mbar button[disabled]{opacity:.35}
.mbar svg{width:18px;height:18px}
.mtitle{font-weight:600;font-size:17px;text-align:center}
.mtitle small{display:block;font-weight:500;font-size:12px;color:var(--t3)}
.big{font-family:var(--fdisp);font-size:44px;line-height:1.05;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px}
.big.neg{color:var(--bad)}
.sub{color:var(--t2);font-size:14px}
.meter{position:relative;height:10px;border-radius:6px;background:var(--p2);margin:14px 0 6px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ac);max-width:100%}
.meter i.over{background:var(--bad)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--t1);border-radius:1px}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--t3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--b1)}
.stat{min-width:0}
.stat span{display:block;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.safe{display:flex;align-items:center;gap:14px}
.safe .big{font-size:30px;margin:0}
.safe p{margin:0;color:var(--t2);font-size:14px;min-width:0}
.ghead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.ghead h3{margin:0;font-size:16px;font-weight:600}
.ghead span{font-size:13px;color:var(--t2)}
.crow{display:block;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--b1)}
.crow:first-of-type{border-top:0}
.crow .l1{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.crow .l1 b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.crow .l1 em{font-style:normal;color:var(--t2);white-space:nowrap}
.crow .l1 em.over{color:var(--bad);font-weight:600}
.crow .l1 em.done{color:var(--ok);font-weight:600}
.bar{position:relative;height:6px;border-radius:4px;background:var(--p2);margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ac)}
.bar i.over{background:var(--bad)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t3);border-radius:1px}
.l2{font-size:12px;color:var(--t3);margin-top:3px}
.empty{color:var(--t2);text-align:center;padding:28px 12px}
.empty b{display:block;color:var(--t1);margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:center;background:var(--acd);color:var(--t1);border-radius:var(--r2);padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner button{margin-left:auto;font-weight:600;color:var(--ac);white-space:nowrap}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:var(--p1);border-top:1px solid var(--b1);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--t3)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ac)}
#fab{position:fixed;z-index:31;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:20px;background:var(--ac);color:var(--bf);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.18)}
#fab svg{width:26px;height:26px}
#fab{transition:transform .2s ease,opacity .2s}
#fab.away{transform:translateY(120px);opacity:0;pointer-events:none}
/* activity */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;min-height:44px;border-radius:var(--r2);border:1px solid var(--b1);background:var(--p1);padding:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:34px;padding:0 12px;border-radius:999px;background:var(--p1);border:1px solid var(--b1);
  color:var(--t2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bf)}
.afilt{display:flex;gap:8px;margin:-2px 0 10px}
.selw{position:relative;flex:1;min-width:0;display:block}
.payrow{display:flex;align-items:center;gap:12px}.payrow label{margin:0;flex:none}.payrow .selw select{min-height:44px;border-color:var(--b2);font-weight:500}
.selw select{width:100%;min-width:0;min-height:40px;-webkit-appearance:none;appearance:none;border-radius:var(--r2);border:1px solid var(--b1);background:var(--p1);color:var(--t1);
  font-size:16px;font-weight:600;padding:0 30px 0 12px;text-overflow:ellipsis}
.selw::after{content:'';position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-6px;border:solid var(--t2);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.asum{display:flex;align-items:center;gap:10px;background:var(--acd);border-radius:var(--r2);padding:10px 12px;font-size:13px;color:var(--t2);margin-bottom:4px}
.asum span{flex:1;min-width:0}
.asum b{display:block;color:var(--t1);font-size:14px}
.tx.flash{animation:txflash 1.6s ease-out}
@keyframes txflash{0%,30%{background:var(--acd)}100%{background:transparent}}
.mhead{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);font-weight:600;margin:16px 2px 6px}
.list{background:var(--p1);border:1px solid var(--cb);box-shadow:var(--csh);border-radius:var(--r);overflow:hidden}
.tx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--b1)}

.swipe{position:relative;overflow:hidden}
.swipe .tx{position:relative;z-index:1;background:var(--p1);touch-action:pan-y}

.swipe .tx{transition:transform .22s ease}
.swa{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 20px;font-weight:700;font-size:14px;color:#fff;opacity:0}
.swl{left:0;background:var(--ac);color:var(--bf)}
.swr{right:0;background:var(--bad);justify-content:flex-end}

.swipe.go .swa{filter:brightness(1.1)}
.swipe.gone{transition:max-height .22s ease;max-height:0 !important}
.swtip{font-size:12px;color:var(--t3);text-align:center;margin:-2px 0 10px}
.tx .tl{flex:1;min-width:0}
.tx .tl b{display:block;font-weight:500;overflow-wrap:anywhere}
.tx .tl small{display:block;color:var(--t3);font-size:12px;overflow-wrap:anywhere}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--ok)}
.pend{font-size:11px;font-weight:700;color:var(--warn);margin-left:4px}
.more{display:block;width:100%;padding:14px;color:var(--ac);font-weight:600}
/* forms */
.form{padding:14px;background:var(--p2);border-top:1px solid var(--b1)}
/* new entry: the save buttons ride along at the bottom of the sheet (and above the keyboard) */
#sheet:has(.stickybar){padding-bottom:0}
#sheet .btns.stickybar{position:sticky;bottom:0;z-index:3;margin:10px -14px 0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--p2);box-shadow:0 -10px 18px -14px rgba(0,0,0,.45);border-top:1px solid var(--b1)}
#sheet.kb .btns.stickybar{padding-bottom:10px}
#sheet.hasbar{padding-bottom:0}
#sheet input,#sheet select,#sheet textarea{scroll-margin-bottom:96px}
#sheet.kb{border-radius:22px;padding-bottom:0}
.field{margin-bottom:12px}
.field label,.flabel{display:block;font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-width:0;min-height:44px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--p1);padding:10px 12px}
.field textarea{min-height:64px;padding:10px 12px;resize:none}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.amtin{font-family:var(--fdisp);font-size:34px !important;min-height:60px !important;font-weight:600;padding:4px 12px !important}
.amtwrap{position:relative}
.amtwrap .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--fdisp);font-size:30px;font-weight:600;color:var(--t2);pointer-events:none}
.amtwrap .amtin{padding-left:36px !important}
.sprow .spa{position:relative;flex:0 0 96px;width:96px}
.sprow .spa .cur{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t2);pointer-events:none}
.sprow .spa input{width:100%;padding-left:22px}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;height:46px;border-radius:var(--r2);background:var(--p1);border:1px solid var(--b2);font-weight:600}
.btn.pri{background:var(--ac);color:var(--bf);border-color:var(--ac)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5}
.seg{display:flex;background:var(--p2);border-radius:var(--r2);padding:3px;margin-bottom:12px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--t2)}
.seg button.on{background:var(--p1);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchips .chip{height:32px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sugg button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--b2);background:var(--p1);color:var(--t2)}
.hint{font-size:12px;color:var(--t3);margin-top:4px}
/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92vh;overflow:auto;
  background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;-webkit-overflow-scrolling:touch}
#sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
#sheet,#picker{overscroll-behavior:contain}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.grab{cursor:grab;touch-action:none;padding:6px 0;margin:-2px auto 8px;width:60px;background-clip:content-box}
.grab{width:40px;height:5px;border-radius:3px;background:var(--b2);margin:4px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shead h2{margin:0;font-family:var(--fdisp);font-size:22px;font-weight:600}
.shead button{color:var(--ac);font-weight:600;padding:8px}
details.set{background:var(--p1);border:1px solid var(--cb);box-shadow:var(--csh);border-radius:var(--r);margin-bottom:10px}
details.set>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;font-weight:600}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary span{font-weight:500;color:var(--t2);font-size:13px;text-align:right;min-width:0;overflow-wrap:anywhere}
details.set .inner{padding:0 16px 16px}
/* sub-sections inside a settings section (Appearance) */
details.sub{border-top:1px solid var(--b1)}
details.sub:first-child{border-top:0}
details.sub>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;font-weight:600;font-size:15px;cursor:pointer}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary span{font-weight:500;color:var(--t2);font-size:13px;text-align:right;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
details.sub>summary span:after{content:'';width:7px;height:7px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(45deg);margin:-3px 2px 0 2px;flex:none}
details.sub[open]>summary span:after{transform:rotate(-135deg);margin-top:3px}
details.sub .subin{padding:0 0 14px}
details.sub .subin>.aprow:first-child,details.sub .subin>.flabel:first-child{margin-top:0}
/* Settings → Categories */
.ogrp{border:1px solid var(--b1);border-radius:var(--r2);margin-top:10px;overflow:hidden}
.ohead{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:var(--p2)}
.ohead b{flex:1;min-width:0}
.ohead small{color:var(--t3);font-size:12px;font-weight:500}
.ocat{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-top:1px solid var(--b1)}
.ocat span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.obtn{flex:none;width:36px;height:36px;border-radius:var(--r2);background:var(--p1);border:1px solid var(--b1);color:var(--t2);font-weight:700;display:grid;place-items:center}
.obtn:disabled{opacity:.35}
.ocat select{flex:none;width:112px;min-height:36px;font-size:16px;border-radius:var(--r2);border:1px solid var(--b1);background:var(--p1);color:var(--t1);padding:0 6px}
/* a smaller Expense / Income switch when editing, so scrolling past it doesn't flip it */
.kseg{display:inline-flex;margin-bottom:10px}
.goalrow{display:block;width:100%;text-align:left}
.gbar{display:block;margin:6px 0 4px}
.gbar i.done{background:var(--ok)}
.gbar i.warn{background:var(--warn)}
.gwarn{color:var(--warn);font-weight:600}
.goalrow em small{font-weight:500;color:var(--t3);font-size:12px}
.recap{border-left:4px solid var(--ac)}
.recap p{margin:6px 0 0;font-size:14px}
.recap .ok{color:var(--ok)}.recap .over{color:var(--bad)}
.recap .ghead{margin-bottom:0}
.rx{width:36px;height:36px;margin:-8px -8px -8px 0;font-size:22px;color:var(--t3);border-radius:var(--r2)}
.rline{margin:0 0 8px;font-size:14px}
.splitbtn{display:inline-block;margin-top:8px;font-size:14px}
.split{margin-top:10px;background:var(--p2);border-radius:var(--r2);padding:10px 12px}
.splithead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sprow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.sprow.main{font-size:14px;color:var(--t2);display:block}
.sprow select{flex:1;min-width:0;min-height:44px;font-size:16px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--p1);color:var(--t1);padding:0 8px}
.sprow input{flex:0 0 96px;width:96px;min-height:44px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--p1);padding:0 10px;text-align:right}
.sprow .obtn{width:40px;height:44px}
.split .over{color:var(--bad)}
.kseg button{flex:none;height:30px;padding:0 12px;font-size:13px;border-radius:7px}
/* Round corners: more room inside so content doesn't crowd the curve */
html[data-corners=round] .card{padding:18px 20px}
html[data-corners=round] details.set>summary{padding:16px 20px}
html[data-corners=round] details.set .inner{padding:0 20px 18px}
html[data-corners=round] .mgroup{padding:0}
html[data-corners=round] .mghead{padding-left:20px;padding-right:18px}
html[data-corners=round] .scrow{padding-left:20px;padding-right:20px}
html[data-corners=round] .bline{padding-left:20px;padding-right:18px}
html[data-corners=round] .seg{padding:4px}
html[data-corners=round] .seg button{border-radius:calc(var(--r2) - 4px)}
html[data-corners=round] .chip{padding-left:14px;padding-right:14px}
html[data-corners=round] #sheet{padding-left:20px;padding-right:20px}
html[data-corners=round] .pbar{border-radius:var(--r)}
/* Larger text: fewer columns where numbers would get cut off */
html[data-fs=l] .stats,html[data-fs=xl] .stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;row-gap:10px}
html[data-fs=xl] table.tb th{letter-spacing:0;font-size:10px}
html[data-fs=xl] table.tb td{font-size:13px}
html[data-fs=xl] .combo{padding:6px}
html[data-fs=xl] .cmini{padding:6px}
html[data-fs=xl] table.tb td{font-size:12px}
.iconopt span{max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.2}
.brow{display:flex;align-items:center;gap:10px;padding:6px 0}
.brow label{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.brow label small{display:block;font-size:12px;color:var(--warn)}
.brow.dim label{color:var(--t3)}
.newcat{background:var(--p2);border-radius:var(--r2);padding:12px;margin-top:6px}
.brow input{width:110px;height:40px;border-radius:10px;border:1px solid var(--b2);background:var(--bg);padding:0 10px;text-align:right}
.bsec{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pal{width:44px;height:44px;border-radius:14px;border:2px solid transparent;display:grid;place-items:center}
.pal.on{border-color:var(--t1)}
.pal i{width:28px;height:28px;border-radius:9px;display:block}
ol.steps{margin:0;padding-left:20px;color:var(--t2);font-size:14px}
ol.steps li{margin-bottom:6px}
code{font-size:12px;background:var(--p2);padding:1px 5px;border-radius:5px}
/* charts */
.chart{margin-top:8px;max-width:100%}
.readout{min-height:40px;font-size:13px;color:var(--t2);margin-bottom:8px}
.readout b{color:var(--t1)}
.plot{position:relative;display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--b2);max-width:100%}
.chart{max-width:100%;overflow:hidden}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative;min-width:0}
.col.sel::before{content:"";position:absolute;inset:0;background:var(--p2);border-radius:6px;z-index:0;box-shadow:0 0 0 2px var(--p2)}
.col i{position:relative;z-index:1;display:block;flex:1 1 0;min-width:0;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.col i.s1{background:var(--s1)}.col i.s2{background:var(--s2)}
.col i.s1.over{background:var(--bad)}
.col .tick{position:absolute;left:8%;right:8%;height:0;border-top:2px dashed var(--t2);z-index:2;pointer-events:none}
.chg{color:var(--warn);font-weight:600}
.tline{position:absolute;left:0;right:0;border-top:2px dashed var(--t3);z-index:2;pointer-events:none}
.tline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--t2);background:var(--p1);padding:0 3px}
.xl{display:flex;gap:4px;margin-top:4px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--t3);min-width:0;overflow:hidden}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.tb{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
table.tb th{text-align:right;font-weight:600;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 0}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{text-align:right;padding:7px 0;border-top:1px solid var(--b1);white-space:nowrap}
table.tb td:first-child{white-space:normal;overflow-wrap:anywhere;padding-right:8px}
.up{color:var(--bad)}.down{color:var(--ok)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--p2);border-radius:var(--r2);padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--t2)}
.ychips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
/* category field + picker */
.catpick{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;text-align:left;padding:8px 14px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--p1)}
.catpick .cn{flex:1;min-width:0;font-weight:600;font-size:16px;overflow-wrap:anywhere;word-break:break-word}
.catpick .cn small{display:block;font-weight:500;font-size:12px;color:var(--t2)}
.catpick .cn small.over{color:var(--bad)}
.catpick .cchg{font-size:13px;font-weight:600;color:var(--ac);white-space:nowrap}
.catpick svg{width:18px;height:18px;color:var(--t3)}
.catpick.empty{border-style:dashed}
.catpick.empty .cn{color:var(--t2);font-weight:500}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick .chip{height:36px;font-size:14px}
#picker{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#picker.on{transform:none;visibility:visible;transition:transform .22s ease}
.pkhead{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;max-width:520px;margin:0 auto}
.pkhead input{flex:1;min-width:0;min-height:46px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--p1);padding:0 14px;font-size:16px}
.pkhead button{color:var(--ac);font-weight:600;padding:8px 4px}
#pk_body{max-width:520px;margin:0 auto}
.pksec{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 8px}
.pkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pkitem{display:block;text-align:left;min-height:58px;padding:9px 12px;border-radius:var(--r2);background:var(--p1);border:1px solid var(--b1);min-width:0}
.pkitem b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.pkitem small{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.pkitem small.over{color:var(--bad)}
.pkitem small.muted{color:var(--t3)}
.pkitem.on{border:2px solid var(--ac);background:var(--acd)}
.pknew{display:block;width:100%;margin-top:16px;height:50px;border-radius:var(--r2);border:1px dashed var(--b2);color:var(--ac);font-weight:600}
/* flat cards sit on a slightly different panel so they still separate from the page */
html[data-cards=flat] .card,html[data-cards=flat] .list,html[data-cards=flat] details.set{background:var(--p2)}
html[data-cards=flat] .kpi,html[data-cards=flat] .newcat{background:var(--p1)}
/* compact density */
html[data-density=compact] body{font-size:14px}
html[data-density=compact] .card{padding:12px;margin-bottom:8px}
html[data-density=compact] .crow{padding:6px 0}
html[data-density=compact] .tx{padding:8px 12px}
html[data-density=compact] .big{font-size:36px}
html[data-density=compact] .safe .big{font-size:26px}
html[data-density=compact] .stats{margin-top:10px;padding-top:8px}
html[data-density=compact] .bar{height:5px;margin-top:4px}
html[data-density=compact] .mbar{margin-bottom:8px}
html[data-density=compact] .field{margin-bottom:9px}

.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:var(--r2);border:2px solid transparent;font-size:11px;font-weight:600;color:var(--t2);min-width:0}
.sw.on{border-color:var(--t1);color:var(--t1)}
.sw i{position:relative;display:block;width:40px;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.12);overflow:hidden}

.sw i em{position:absolute;right:5px;top:5px;width:10px;height:10px;border-radius:50%}
.stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stylecard{text-align:left;padding:10px 12px;border-radius:var(--r2);border:1px solid var(--b1);background:var(--bg);min-width:0}
.stylecard.on{border:2px solid var(--ac);background:var(--acd)}
.stylecard b{display:block;font-size:24px;line-height:1.1;font-weight:600}
.stylecard span{display:block;font-size:13px;margin-top:2px}
.stylecard small{display:block;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:6px}
.aprow{margin-top:14px}
/* plan */
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--b1)}
.ghead+.prow{border-top:0}
.prow .pl{flex:1;min-width:0}
.prow .pl b{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.prow .pl small{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.prow input{width:96px;flex:0 0 96px;min-height:44px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--bg);padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}
.prow.chg input{border:2px solid var(--ac)}
.prow.dim .pl b{color:var(--t3)}
.chgt{color:var(--warn);font-weight:600}
.linkbtn{color:var(--ac);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
#bulk_bar{position:fixed;z-index:29;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto}
.pbar.bbar{flex-direction:row;align-items:center;gap:6px;padding:8px 8px 8px 14px}
.bbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar button{flex:none;padding:0 12px}
body.on-bulk #fab{display:none}

  var F = forecast(key, s, bt, day, dim), end = MON[ymM(key)] + ' ' + dim, cls = F.left >= 0 ? 'ok' : 'bad';
  return '<div class="fcast ' + cls + '"><span>Forecast: about <b data-count="' + Math.abs(F.left) + '" data-ck="fc' + key + '" data-good="' + (F.left >= 0 ? 'up' : 'down') + '">' + money(Math.abs(F.left)) + '</b> ' + (F.left >= 0 ? 'under' : 'over') + ' by ' + end + '</span>' +
    '<details class="itip"><summary>ⓘ</summary><div class="hint">Everyday spending at your pace so far this month (mixed with your usual pace while the month is young), plus bills and giving at their budgeted amounts unless they’ve already cost more. Savings aren’t counted.</div></details></div>';
}
// ---- the year so far, and where it's heading
function yearSoFarHtml(key) {
  var y = ymY(key), m = ymM(key), dim = daysIn(y, m), day = NOW.getDate();
  var spent = 0, bud = 0, inc = 0, saved = 0, full = 0, fullGap = 0, n = 0;
  for (var mm = 0; mm <= m; mm++) {
    var k = ymKey(y, mm), ms = monthStats(k), bt = budgetTotals(k);
    if (!ms.n && mm < m) continue;                     // months with nothing logged don't count as "under"
    var b = mm === m ? bt.spend * day / dim : bt.spend;
    spent += ms.spentB; bud += b; inc += ms.inc; saved += ms.saved; n++;
    if (mm < m && ms.n) { full++; fullGap += bt.spend - ms.spentB; }
  }
  if (!n) return '';
  var gap = bud - spent, rate = inc > 0 ? saved / inc : 0;
  var rest = 11 - m + (1 - day / dim), proj = gap + (full ? fullGap / full : 0) * rest;
  return '<button class="card ysf" data-act="ysf"><div class="ghead"><h3>' + y + ' so far</h3><i class="chev rt"></i></div>' +
    '<p><b class="' + (gap >= 0 ? 'ok' : 'bad') + '"><span data-count="' + Math.abs(gap) + '" data-ck="ysf' + y + '" data-good="' + (gap >= 0 ? 'up' : 'down') + '">' + money(Math.abs(gap)) + '</span> ' + (gap >= 0 ? 'under' : 'over') + '</b> budget' +
    (inc > 0 ? ' · <b>' + Math.round(rate * 100) + '%</b> of income saved' : '') + '</p>' +
    (full ? '<p class="l2">On pace to finish ' + y + ' about ' + money(Math.abs(proj)) + ' ' + (proj >= 0 ? 'under' : 'over') + '.</p>' : '') + '</button>';
}

// ---- the one-sentence status at the top of this month
function todayLineHtml(key, s, bt, left, pct, pace, dim, day) {
  var flexLeft = bt.flex - s.flex, daysLeft = dim - day + 1, perDay = flexLeft > 0 ? flexLeft / daysLeft : 0;
  var flexPct = bt.flex > 0 ? s.flex / bt.flex : 0, st, cls;
  if (left < 0) { st = 'Over budget'; cls = 'bad'; }
  else if (flexPct > pace + 0.12 && flexPct > 0.2) { st = 'Spending a little fast'; cls = 'warn'; }
  else { st = 'On track'; cls = 'ok'; }
  var bits = [];
  bits.push(flexLeft > 0 ? '<b data-count="' + perDay + '" data-ck="perday' + key + '" data-good="up">' + money(perDay) + '</b> a day for everyday spending' : 'everyday budget used up');
  var next = null;
  recurBills().forEach(function (b) {
    if (recurStatus(b, key).s === 'paid') return;
    var dd = Math.round((parseD(dueDate(b, key)) - parseD(todayStr())) / 86400000);
    if (dd >= 0 && dd <= 7 && (!next || dd < next.d)) next = { b: b, d: dd };
  });
  if (next) bits.push(esc(next.b.name) + ' due ' + (next.d === 0 ? 'today' : next.d === 1 ? 'tomorrow' : DAYS[parseD(dueDate(next.b, key)).getDay()]));
  var sub = flexLeft > 0 ? money(flexLeft) + ' of ' + money(bt.flex) + ' left for the next ' + daysLeft + ' day' + (daysLeft === 1 ? '' : 's')
    : money(-flexLeft) + ' over the everyday budget of ' + money(bt.flex);
  return '<div class="today ' + cls + '" id="today"><i class="tdot2"></i><div><b class="tst">' + st + '</b> · ' + bits.join(' · ') + '<small>' + sub + '</small></div></div>';
}
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ---- money in vs money out (cash, not budget): one line that opens into the details
function expectedIncome(key) {
  var bt = budgetTotals(key);
  if (bt.inc > 0) return bt.inc;
  var n = 0, t = 0;
  for (var k = key - 3; k < key; k++) { var ms = monthStats(k); if (ms.inc > 0) { n++; t += ms.inc; } }
  return n ? t / n : 0;
}
function inOutHtml(key, s, bt, isCur) {
  var inc = s.inc, out = s.spentAll, saved = s.saved, net = inc - out - saved, exp = Math.max(expectedIncome(key), inc);
  var cls, line, ratio = inc > 0 ? out / inc : 0;
  if (!isCur) {
    cls = net >= 0 ? 'ok' : 'bad';
    line = 'In ' + money(inc) + ' · out ' + money(out) + (saved ? ' · saved ' + money(saved) : '') + ' · <b>' + (net >= 0 ? money(net) + ' left over' : money(-net) + ' short') + '</b>';
  } else if (net >= 0) {
    cls = 'ok'; line = 'In ' + money(inc) + ' · out ' + money(out) + ' · <b>' + money(net) + ' ahead</b> so far';
  } else if (exp - out - saved >= 0) {
    cls = 'warn';
    line = inc > 0 ? (ratio >= 1.2 ? '<b>Out is ' + ratio.toFixed(1) + '× what’s come in</b> so far' : '<b>' + money(-net) + ' more out than in</b> so far') + ' · more pay still to come'
      : '<b>No income logged yet</b> · ' + money(out) + ' out so far';
  } else {
    cls = 'bad';
    var short = out + saved - exp;
    line = (inc > 0 && ratio >= 1.2 ? '<b>Out is ' + ratio.toFixed(1) + '× what’s come in</b>' : '<b>' + money(-net) + ' more out than in</b>') + ' · even with the rest of this month’s pay, about ' + money(short) + ' short';
  }
  var h = '<button class="inout ' + cls + '" data-act="heroexp" aria-expanded="' + !!UI.heroOpen + '"><span>' + line + '</span><i class="chev' + (UI.heroOpen ? ' up' : '') + '"></i></button>';
  if (UI.heroOpen) {
    h += '<div class="stats">' + stat('In', money(inc)) + stat('Out', money(out)) + stat('Saved', money(saved)) + stat('Net', signed(net)) + '</div>' +
      '<div class="iohint">' + (isCur && exp > inc ? 'About ' + money(exp - inc) + ' more pay expected this month (' + (bt.inc > 0 ? 'your planned income' : 'your recent average') + '). ' : '') +
      '“Out” is everything you spent, trips included' + (saved ? '; money moved to savings is counted separately' : '') + '.' +
      (s.fromSave ? ' ' + money(s.fromSave) + ' paid from savings isn’t counted.' : '') + (s.owed ? ' Only your share counts on purchases others owe you for.' : '') + '</div>';
  }
  return h;
}

function demoBanner() {
  return S.demo ? '<div class="banner"><span>Showing real totals from your sheet as a preview. Connect it to go live.</span><button data-act="settings" data-v="conn">Connect</button></div>' : '';
}

// ------------------------------------------------------------------ month view
function viewMonth() {
  var cur = nowYM(), r = dataRange();
  if (UI.ym === null) UI.ym = cur;
  var key = UI.ym, y = ymY(key), m = ymM(key);
  var s = monthStats(key), bt = budgetTotals(key);
  var isCur = key === cur, isFuture = key > cur;
  var dim = daysIn(y, m), day = isCur ? NOW.getDate() : (isFuture ? 0 : dim);
  var pace = day / dim;
  var left = bt.spend - s.spentB;
  var pct = bt.spend > 0 ? s.spentB / bt.spend : 0;
  var h = demoBanner() + seedBanner();

  h += '<div class="mbar"><button data-act="mprev" aria-label="Previous month"' + (key <= r.lo ? ' disabled' : '') + '>' + svgChevron(true) + '</button>' +
    '<div class="mtitle">' + MONTHS[m] + ' ' + y + '<small>' + (isCur ? 'Day ' + day + ' of ' + dim : (isFuture ? 'Upcoming' : 'Closed month')) + '</small></div>' +
    '<button data-act="mnext" aria-label="Next month"' + (key >= cur ? ' disabled' : '') + '>' + svgChevron(false) + '</button></div>';

  if (isCur) h += todayLineHtml(key, s, bt, left, pct, pace, dim, day);
  if (isCur) h += tripNowHtml() + billRemindHtml(key) + checkinCardHtml();
  h += '<section class="card hero"><div class="eyebrow">' + (left >= 0 ? 'Left in budget' : 'Over budget') + '</div>' +
    '<div class="bigrow"><div class="big' + (left < 0 ? ' neg' : '') + '" data-count="' + Math.abs(left) + '" data-ck="hero' + key + '" data-good="' + (left < 0 ? 'down' : 'up') + '" data-delta>' + money(Math.abs(left)) + '</div></div>' +
    '<div class="sub">Spent <span data-count="' + s.spentB + '" data-ck="spent' + key + '" data-good="down">' + money(s.spentB) + '</span> of ' + money(bt.spend) + ' budgeted' + (s.spentB !== s.spent ? ' <span class="yset">(yearly bills as set aside)</span>' : '') + (s.trip ? ' · plus <b class="tnum">' + money(s.trip) + '</b> on trips' : '') + '</div>' +
    '<div class="meter"><i class="' + (pct > 1 ? 'over' : '') + '" data-bar="hero' + key + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i>' +
    (isCur ? '<b style="left:' + (pace * 100).toFixed(1) + '%" title="Where you’d be if spending evenly"></b>' : '') + '</div>' +
    '<div class="mlab"><span>' + Math.round(pct * 100) + '% used</span><span>' + (isCur ? 'line = ' + Math.round(pace * 100) + '% of month gone' : '') + '</span></div>' +
    (isCur ? forecastHtml(key, s, bt, day, dim) : '') +
    inOutHtml(key, s, bt, isCur) + '</section>';

  if (isCur) h += recapCardHtml();
  if (!s.n && !isCur) {
    h += '<div class="card empty"><b>Nothing logged for ' + MONTHS[m] + '</b>Entries you add for this month will show up here.</div>';
    return h;
  }

  monthGroupOrder(key).forEach(function (g) {
    var rows = [], gs = 0, gb = 0;
    var cats = {};
    var bm = bmap(key);
    Object.keys(bm).forEach(function (k) { if (bm[k].g === g.id) cats[k] = 1; });
    Object.keys(s.cat).forEach(function (k) { if (groupOf(k, key) === g.id) cats[k] = 1; });
    Object.keys(cats).forEach(function (c) {
      var spent = s.cat[c] || 0, bud = budgetOf(c, key), yr = isYearly(c) ? yearlyInfo(c, key) : null;
      if (!spent && !bud) return;
      gs += yr ? bud : spent; gb += bud;
      rows.push({ c: c, spent: spent, bud: bud, prev: budgetPrev(c, key), yr: yr, carry: rollCarry(c, key) });
    });
    if (!rows.length) return;
    rows = sortCats(g.id, rows, function (a, b) { return (b.bud || 0) - (a.bud || 0) || b.spent - a.spent; });
    h += monthGroupHtml(g, rows, gs, gb, isCur ? pace : 1);
  });
  if (!isFuture) h += billsLineHtml(key);
  if (isCur) h += owedLineHtml() + yearSoFarHtml(key);
  // trips whose dates touch this month, plus any with spending logged in it
  var mStart = y + '-' + pad(m + 1) + '-01', mEnd = y + '-' + pad(m + 1) + '-' + pad(dim), tnames = {};
  S.trips.forEach(function (t) { if (t.start && t.start <= mEnd && tripEnd(t) >= mStart) tnames[low(t.name)] = t.name; });
  Object.keys(s.tripBy).forEach(function (n) { if (!tnames[low(n)]) tnames[low(n)] = n; });
  var tlist = Object.keys(tnames).map(function (k2) { return tnames[k2]; });
  if (tlist.length) {
    h += '<section class="card"><div class="ghead"><h3>Trips</h3><span class="num">' + (s.trip ? money(s.trip) + ' this month' : '') + '</span></div>';
    tlist.sort(function (a, b) { return (s.tripBy[b] || 0) - (s.tripBy[a] || 0); }).forEach(function (name) {
      var tt = tripByName(name);
      h += '<button class="crow" data-act="tripview" data-v="' + esc(name) + '"><div class="l1"><b><i class="tdot"></i>' + esc(name) + '</b><em>' + money(s.tripBy[name] || 0, true) + '</em></div>' +
        (tt ? '<div class="l2">' + tripRange(tt) + (tripBudget(tt) ? ' · ' + money(tripStats(tt.name).total) + ' of ' + money(tripBudget(tt)) + ' for the whole trip' : '') + '</div>' : '') + '</button>';
    });
    h += '</section>';
  }



  if (isCur) h += goalsCardHtml(false);
  if (key < cur) h += '<button class="btn" style="width:100%;margin-bottom:12px" data-act="recap" data-v="' + key + '">' + MONTHS[m] + ' recap</button>';
  if (key >= cur) h += '<button class="btn" style="width:100%;margin-bottom:12px" data-act="goplan" data-v="' + key + '">Change ' + MONTHS[m] + '’s budget</button>';
  var expInc = bt.inc;
  if (expInc) {
    h += '<section class="card"><div class="ghead"><h3>Income</h3><span class="num">' + money(s.inc) + ' / ' + money(expInc) + ' planned</span></div>';
    var icats = Object.keys(s.icat);
    if (!icats.length) h += '<div class="l2">No income logged yet this month.</div>';
    icats.sort(function (a, b) { return s.icat[b] - s.icat[a]; }).forEach(function (c) {
      h += '<button class="crow" data-act="cat" data-v="' + esc(c) + '" data-k="i"><div class="l1"><b>' + esc(c) + '</b><em>' + money(s.icat[c], true) + '</em></div></button>';
    });
    h += '</section>';
  }
  return h;
}

// A group on the Month tab: one line (bar + what's left) that opens into its categories.
function groupOpen(gid, rows) {
  S.mopen = S.mopen || {};
  if (S.mopen[gid] !== undefined) return S.mopen[gid];
  return rows.some(function (r) { return gid !== 'save' && !r.yr && r.bud > 0 && r.spent - r.bud > 0.5; });   // something over budget: show it
}
function monthGroupHtml(g, rows, gs, gb, pace) {
  var open = groupOpen(g.id, rows), pct = gb > 0 ? gs / gb : (gs > 0 ? 1.01 : 0), over = rows.filter(function (r) { return !r.yr && r.bud > 0 && r.spent - r.bud > 0.5; }).length;
  var right;
  if (g.id === 'bills') {
    var paid = rows.filter(function (r) { return r.spent > 0 || (r.yr && !r.yr.dueNow); }).length;
    right = paid + ' of ' + rows.length + ' paid';
  } else if (g.id === 'save') right = money(gs) + ' of ' + money(gb);
  else right = gs - gb > 0.5 ? '<span class="over"><span data-count="' + (gs - gb) + '" data-ck="gover' + g.id + '" data-good="down">' + money(gs - gb) + '</span> over</span>'
    : '<span data-count="' + (gb - gs) + '" data-ck="gleft' + g.id + '" data-good="up">' + money(gb - gs) + '</span> left';
  var h = '<section class="card mgroup' + (open ? ' open' : '') + '"><button class="mghead" data-act="mgrp" data-v="' + g.id + '" aria-expanded="' + open + '">' +
    '<span class="mgname"><b>' + g.name + '</b><small><span data-count="' + gs + '" data-ck="gs' + g.id + '">' + money(gs) + '</span> of ' + money(gb) + (over && g.id !== 'save' ? ' · <span class="over">' + over + ' over</span>' : '') + '</small></span>' +
    '<span class="mgright">' + right + '</span><i class="chev' + (open ? ' up' : '') + '"></i>' +
    '<span class="bar mgbar"><i class="' + (pct > 1 && g.id !== 'save' ? 'over' : '') + '" data-bar="g' + g.id + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i>' +
    (FLEX[g.id] && pace < 1 && gb > 0 ? '<b style="left:' + (pace * 100).toFixed(1) + '%"></b>' : '') + '</span></button>';
  h += '<div class="mgbody"><div class="mgin">';
  rows.forEach(function (row) { h += slimCatRow(row, g.id, pace); });
  return h + '</div></div></section>';
}
function slimCatRow(row, gid, pace) {
  var pct = row.bud > 0 ? row.spent / row.bud : (row.spent > 0 ? 1.01 : 0), over = row.bud > 0 && row.spent - row.bud > 0.5 || (!row.bud && row.spent > 0 && gid !== 'save');
  var right;
  if (row.yr) {
    var Y = row.yr, ahead = Y.paidYear - Y.setYear;
    pct = Y.plan > 0 ? Math.min(1, Y.paidYear / Y.plan) : 0; over = Y.paidYear - Y.plan > 0.5;
    right = row.spent > 0 ? '<em class="' + (over ? 'over' : 'done') + '">paid ' + money(row.spent) + (over ? ' · over the year' : ' ✓') + '</em>'
      : '<em>' + money(row.bud) + ' set aside' + (Y.next !== null ? ' · due ' + MON[Y.next] : '') + '</em>';
    return '<button class="scrow" data-act="cat" data-v="' + esc(row.c) + '" data-k="e"><b>' + esc(row.c) + '<small class="ytag">yearly · ' + money(Y.paidYear) + ' of ' + money(Y.plan) + ' this year</small></b>' +
      '<span class="bar sbar"><i class="' + (over ? 'over' : '') + '" style="width:' + (pct * 100).toFixed(1) + '%"></i></span>' + right + '</button>';
  }
  if (gid === 'bills') right = row.spent > 0 ? (row.spent - row.bud > 0.5 ? '<em class="over">' + money(row.spent - row.bud) + ' over</em>' : '<em class="done">✓ paid</em>') : '<em>' + money(row.bud) + ' due</em>';
  else if (gid === 'save') right = '<em' + (row.spent >= row.bud && row.bud > 0 ? ' class="done"' : '') + '>' + money(row.spent) + ' of ' + money(row.bud) + '</em>';
  else if (!row.bud) right = '<em class="over"><span data-count="' + row.spent + '" data-ck="cs' + esc(row.c) + '" data-good="down">' + money(row.spent) + '</span> · no budget</em>';
  else right = row.spent - row.bud > 0.5 ? '<em class="over"><span data-count="' + (row.spent - row.bud) + '" data-ck="co' + esc(row.c) + '" data-good="down">' + money(row.spent - row.bud) + '</span> over</em>'
    : '<em><span data-count="' + (row.bud - row.spent) + '" data-ck="cl' + esc(row.c) + '" data-good="up">' + money(row.bud - row.spent) + '</span> left</em>';
  return '<button class="scrow" data-act="cat" data-v="' + esc(row.c) + '" data-k="e"><b>' + esc(row.c) + (row.carry ? '<small class="ytag">' + (row.carry > 0 ? '+' + money(row.carry) + ' carried over' : money(-row.carry) + ' less (last month over)') + '</small>' : '') + '</b>' +
    '<span class="bar sbar"><i class="' + (over && gid !== 'save' ? 'over' : '') + '" data-bar="c' + esc(row.c) + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i></span>' + right + '</button>';
}
// Recurring bills on the Month tab: a slim reminder up top only when one is due soon or late
function billRemindList(key) {
  var today = todayStr(), list = [];
  if (key !== nowYM()) return list;
  recurBills().forEach(function (b) {
    var st = recurStatus(b, key); if (st.s === 'paid') return;
    var d = Math.round((parseD(dueDate(b, key)) - parseD(today)) / 86400000);
    if (d <= 3) list.push({ b: b, st: st, d: d });
  });
  return list;
}
function billRemindHtml(key) {
  if (!S.recur.length || key !== nowYM()) return '';
  var list = billRemindList(key);
  if (!list.length) return '';
  list.sort(function (p, q) { return p.d - q.d; });
  return '<section class="card bremind">' + list.map(function (x) {
    return '<div class="rrow ' + x.st.s + '"><span class="rday">' + dueDay(x.b, key) + '</span><div class="rmain"><b>' + esc(x.b.name) + ' · ' + money(x.b.a, true) + '</b><small>' +
      (x.d < 0 ? 'was due ' + shortDate(dueDate(x.b, key)) + ' — not logged yet' : x.d === 0 ? 'due today' : 'due in ' + x.d + ' day' + (x.d === 1 ? '' : 's')) + '</small></div>' +
      '<button class="rlog" data-act="recurlog" data-v="' + esc(x.b.name) + '" data-k="' + key + '">Log</button></div>';
  }).join('') + '</section>';
}
// …and one line further down that opens the full list
function billsLineHtml(key) {
  if (!S.recur.length) {
    var sug = key === nowYM() ? recurSuggestions() : [];
    return sug.length ? '<button class="card bline" data-act="recur"><span><b>Recurring bills</b><small>' + sug.length + ' look like they repeat — set them up</small></span><i class="chev rt"></i></button>' : '';
  }
  var paid = 0, due = 0, next = null;
  if (!recurBills().length) return '';
  recurBills().forEach(function (b) {
    var st = recurStatus(b, key);
    if (st.s === 'paid') paid++; else { due++; if (!next || dueDay(b, key) < dueDay(next, key)) next = b; }
  });
  return '<button class="card bline" data-act="recurmonth" data-v="' + key + '"><span><b>Bills</b><small>' + paid + ' paid · ' + due + ' due' +
    (next ? ' · next: ' + esc(next.name) + ' ' + shortDate(dueDate(next, key)) : ' · all paid ✓') + '</small></span><i class="chev rt"></i></button>';
}

function stat(label, val) { return '<div class="stat"><span>' + label + '</span><b>' + val + '</b></div>'; }

function catRow(row, gid, pace) {
  var pct = row.bud > 0 ? row.spent / row.bud : (row.spent > 0 ? 1.01 : 0);
  var over = row.spent - row.bud > 0.5;
  var right;
  if (gid === 'bills') {
    right = row.spent > 0 ? (over ? '<em class="over">' + money(row.spent - row.bud) + ' over</em>' : '<em class="done">✓ paid</em>') : '<em>' + money(row.bud) + ' due</em>';
  } else if (gid === 'save') {
    right = row.spent >= row.bud && row.bud > 0 ? '<em class="done">✓ ' + money(row.spent) + '</em>' : '<em>' + money(row.spent) + ' of ' + money(row.bud) + '</em>';
  } else if (over) {
    right = '<em class="over">' + money(row.spent - row.bud) + ' over</em>';
  } else {
    right = '<em>' + money(row.bud - row.spent) + ' left</em>';
  }
  var showPace = FLEX[gid] && pace < 1 && row.bud > 0;
  return '<button class="crow" data-act="cat" data-v="' + esc(row.c) + '" data-k="e"><div class="l1"><b>' + esc(row.c) + '</b>' + right + '</div>' +
    '<div class="bar"><i class="' + (over && gid !== 'save' ? 'over' : '') + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i>' +
    (showPace ? '<b style="left:' + (pace * 100).toFixed(1) + '%"></b>' : '') + '</div>' +
    '<div class="l2">' + money(row.spent, true) + (row.bud ? ' of ' + money(row.bud) : ' · no budget set') +
    (row.prev !== null && row.prev !== undefined && row.prev !== row.bud ? ' · <span class="chg">' + (row.prev ? 'was ' + money(row.prev) : 'new') + ' this month</span>' : '') + '</div></button>';
}

function svgChevron(left) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="' + (left ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7') + '"/></svg>';

// ------------------------------------------------------------------ activity view
// "april", "apr 2025", "2025", "april costco": month and year words filter by when, the rest is a text search.
var MONTH_WORDS = { jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6,
  aug: 7, august: 7, sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11 };
function parseQuery(q) {
  var out = { m: null, y: null, rest: [] };
  low(q).split(/[\s,\/]+/).forEach(function (w) {
    if (!w) return;
    if (out.m === null && MONTH_WORDS.hasOwnProperty(w)) out.m = MONTH_WORDS[w];
    else if (out.y === null && /^20\d\d$/.test(w)) out.y = +w;
    else if (out.y === null && /^'\d\d$/.test(w)) out.y = 2000 + +w.slice(1);
    else out.rest.push(w);
  });
  out.rest = out.rest.join(' ');
  return out;
}
function filteredTx() {
  var pq = parseQuery(UI.q), q = pq.rest, fk = UI.fk, am = UI.am === '' ? null : +UI.am;
  var list = S.tx.filter(function (t) {
    if (fk === 'e' && t.k !== 'e') return false;
    if (fk === 'i' && t.k !== 'i') return false;
    if (fk === 't' && !t.tr) return false;
    if (am !== null && ymKey(t.y, t.m) !== am) return false;
    if (pq.m !== null && t.m !== pq.m) return false;
    if (pq.y !== null && t.y !== pq.y) return false;
    if (q && (low(t.v) + ' ' + low(t.c) + ' ' + low(t.n) + ' ' + low(t.tr) + ' ' + String(t.a)).indexOf(q) < 0) return false;
    return true;
  });
  var dir = UI.asort === 'old' ? -1 : 1;
  list.sort(function (a, b) {
    if (UI.asort === 'big') { if (b.a !== a.a) return b.a - a.a; }
    var ka = ymKey(a.y, a.m), kb = ymKey(b.y, b.m);
    if (ka !== kb) return (kb - ka) * dir;
    if ((a.p ? 1 : 0) !== (b.p ? 1 : 0)) return a.p ? -1 : 1;
    if ((a.d || '') !== (b.d || '')) return ((b.d || '') < (a.d || '') ? -1 : 1) * dir;
    if (a.k !== b.k) return a.k === 'i' ? -1 : 1;
    return ((a.r || 0) - (b.r || 0)) * dir;
  });
  return list;
}
function activityMonths() {
  var cnt = {};
  S.tx.forEach(function (t) { var k = ymKey(t.y, t.m); cnt[k] = (cnt[k] || 0) + 1; });
  return Object.keys(cnt).map(Number).sort(function (a, b) { return b - a; }).map(function (k) { return [k, cnt[k]]; });
}
function activeFilters() { return (UI.fk !== 'all' ? 1 : 0) + (UI.am !== '' ? 1 : 0) + (UI.asort !== 'new' ? 1 : 0); }
function activityFilterSheet() {

}

function planMap(key) {

// What you've actually been doing: averages of the last 6 complete months that have data.
// cat / spent leave trips out (they're not everyday spending); spentAll includes them.
function paceStats() {
  if (CACHE.pace) return CACHE.pace;
  var cur = nowYM(), r = dataRange(), n = 0, p = { inc: 0, spent: 0, spentAll: 0, trip: 0, saved: 0, cat: {}, n: 0 };
  for (var k = cur - 6; k < cur; k++) {

    p.inc += ms.inc; p.spent += ms.spent; p.spentAll += ms.spentAll; p.trip += ms.trip; p.saved += ms.saved;
    Object.keys(ms.cat).forEach(function (c) { p.cat[c] = (p.cat[c] || 0) + ms.cat[c]; });
  }
  if (n) { ['inc', 'spent', 'spentAll', 'trip', 'saved'].forEach(function (f) { p[f] /= n; }); Object.keys(p.cat).forEach(function (c) { p.cat[c] /= n; }); }
  p.n = n;

// ================================================================== Plan helpers (2.11)
// ---- 1. your budget vs how you actually spend (last full months, your share, trips & savings-paid left out)
function paceMonths() {
  var cur = nowYM(), r = dataRange(), ks = [];
  for (var k = cur - 6; k < cur; k++) { if (k >= r.lo && monthStats(k).n) ks.push(k); }
  return ks;
}
function realityRows() {
  if (CACHE.real) return CACHE.real;
  var cur = nowYM(), pace = paceStats(), bm = bmap(cur), rows = [], seen = {};
  if (pace.n < 2) return (CACHE.real = rows);
  var seenIn = {};      // in how many of those months each category had spending
  paceMonths().forEach(function (k) { var mc = monthStats(k).cat; Object.keys(mc).forEach(function (c) { if (mc[c] > 0) seenIn[c] = (seenIn[c] || 0) + 1; }); });
  function add(c, bud, g, isNew) {
    var avg = pace.cat[c] || 0, gap = avg - bud;
    if (g === 'bills' && (seenIn[c] || 0) < Math.max(2, pace.n - 1)) return;   // paid now and then (insurance…): an average would mislead
    if (Math.abs(gap) < Math.max(15, bud * 0.15)) return;
    var sug = g === 'bills' ? Math.round(avg) : avg >= 200 ? Math.round(avg / 10) * 10 : Math.max(0, round5(avg));
    if (Math.abs(sug - bud) < 5) return;

  }
  Object.keys(bm).forEach(function (c) {
    var b = bm[c]; seen[c] = 1;
    if (b.rm || b.g === 'inc' || b.g === 'save' || isYearly(c)) return;
    add(c, b.a, b.g, false);

  Object.keys(pace.cat).forEach(function (c) {
    if (seen[c] || isYearly(c) || !c || (pace.cat[c] || 0) < 20) return;
    var g = groupOf(c, cur); if (g === 'save' || g === 'inc') return;
    add(c, 0, g, true);

  return (CACHE.real = rows);
}
function realityInDraft(x) { var d = planState().vals[x.c]; return !!(d && !d.rm && Math.abs(d.a - x.sug) < 0.005); }

// ---- 2. coming up in the next few months
function comingUpItems(k) {

    items.push({ i: '📅', t: '<b>' + esc(c) + '</b> · yearly bill', a: est, n: ly ? 'last year ' + money(ly) : 'estimated' });
  });
  (S.trips || []).forEach(function (t) {

  });

  });
  var bm = bmap(k);
  Object.keys(bm).forEach(function (c) {
    if (bm[c].s !== k) return;
    var was = bmap(k - 1)[c], wa = was && !was.rm ? was.a : 0;
    if (bm[c].rm && !wa) return;
    if (!bm[c].rm && Math.abs(bm[c].a - wa) < 0.005) return;
    items.push({ i: '✎', t: '<b>' + esc(c) + '</b> ' + (bm[c].g === 'inc' ? 'income' : 'budget'), a: 0, n: bm[c].rm ? 'removed' : (wa ? money(wa) + ' → ' + money(bm[c].a) : 'starts at ' + money(bm[c].a)) });

      n: 'more than you usually spend on ' + (extra.length === 1 ? 'it' : 'those') + (lm.trip ? ' · plus ' + money(lm.trip) + ' on trips' : '') });

}

// ---- 3. plan by paycheck. S.pay = { k: 'semi', d: [10, 25] } or { k: 'bi', a: 'YYYY-MM-DD' (any payday) }
function payCat() {

  var best = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; })[0];

}
// a typical recent paycheck: the middle of your last four
function payAmount() {

// ---- what-if: a sandbox
function wiState() {
  var P = planState();

}
// The amounts a what-if would give each category (only the ones that change).
function whatIfVals() {
  var W = wiState(), pace = paceStats(), cur = nowYM(), m = planMap(cur), out = {};
  if (W.mode === 'avg') {
    Object.keys(m).forEach(function (c) {
      var g = m[c].g, avg = pace.cat[c] || 0;

      var a = avg * (1 + (W.scale || 0));
      out[c] = g === 'bills' ? r2(a) : round5(a);
    });
    return out;
  }
  var inc = +W.inc || 0, save = W.save === null ? planTotals(cur).save : +W.save, bills = 0, flex = 0;
  Object.keys(m).forEach(function (c) { var g = m[c].g; if (g === 'bills') bills += m[c].a; else if (g !== 'inc' && g !== 'save') flex += m[c].a; });
  if (W.fit && flex > 0) {
    var f = Math.max(0, inc - save - bills) / flex;
    Object.keys(m).forEach(function (c) { var g = m[c].g; if (g !== 'bills' && g !== 'inc' && g !== 'save') out[c] = round5(m[c].a * f); });
  }
  return out;
}
function whatIfTotals() {
  var W = wiState(), cur = nowYM(), m = planMap(cur), v = whatIfVals(), t = { inc: 0, spend: 0, save: 0, g: {}, now: { g: {} } };
  Object.keys(m).forEach(function (c) {
    var g = m[c].g, a = v[c] !== undefined ? v[c] : m[c].a;
    t.now.g[g] = (t.now.g[g] || 0) + m[c].a;
    t.g[g] = (t.g[g] || 0) + a;
    if (g === 'inc') t.inc += a; else if (g === 'save') t.save += a; else t.spend += a;
  });
  if (W.mode === 'inc') {
    t.inc = +W.inc || 0;
    if (W.save !== null) { t.save = +W.save; t.g.save = t.save; }
  }
  return t;
}

function whatIfResultHtml() {

// Small SVG line chart with a tap/drag readout. series: [{name, vals}]
function lineChart(id, labels, ticks, series) {
  var W = 340, H = 170, pl = 6, pr = 6, pt = 10, pb = 22, n = labels.length;
  var lo = 0, hi = 0;
  series.forEach(function (s) { s.vals.forEach(function (v) { if (v < lo) lo = v; if (v > hi) hi = v; }); });
  if (hi === lo) hi = lo + 1;
  var pad = (hi - lo) * 0.08; hi += pad; if (lo < 0) lo -= pad;
  function X(i) { return pl + i * (W - pl - pr) / Math.max(1, n - 1); }
  function Y(v) { return pt + (hi - v) / (hi - lo) * (H - pt - pb); }
  LCHARTS[id] = { labels: labels, series: series, X: X, Y: Y, n: n, W: W };
  var sel = UI.sel[id] === undefined || UI.sel[id] >= n ? n - 1 : UI.sel[id];
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="lsvg" data-lchart="' + id + '" role="img" aria-label="' + esc(series.map(function (s) { return s.name; }).join(' vs ')) + '">';
  svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" class="lzero"/>';
  ticks.forEach(function (t, i) { svg += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" class="ltick">' + esc(t) + '</text>'; });
  svg += '<line id="lx_' + id + '" class="lcross" y1="' + pt + '" y2="' + (H - pb) + '" x1="' + X(sel).toFixed(1) + '" x2="' + X(sel).toFixed(1) + '"/>';
  series.forEach(function (s, si) {
    svg += '<path class="lline" style="stroke:var(--s' + (si + 1) + ')" d="' + s.vals.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ') + '"/>';
  });
  series.forEach(function (s, si) {
    svg += '<circle id="ld_' + id + '_' + si + '" class="ldot" r="4.5" style="fill:var(--s' + (si + 1) + ')" cx="' + X(sel).toFixed(1) + '" cy="' + Y(s.vals[sel]).toFixed(1) + '"/>';
  });
  svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent" class="lhit"/></svg>';
  return '<div class="chart lchart"><div class="readout" id="ro_' + id + '">' + lineReadout(id, sel) + '</div>' + svg +
    '<div class="legend">' + series.map(function (s, i) { return '<span><i style="background:var(--s' + (i + 1) + ')"></i>' + esc(s.name) + '</span>'; }).join('') + '</div></div>';
}
function lineReadout(id, i) {
  var c = LCHARTS[id];
  return '<b>By ' + esc(c.labels[i]) + '</b><br>' + c.series.map(function (s) { return esc(s.name) + ' <b>' + signed(s.vals[i]) + '</b>'; }).join(' · ');
}
function lineSelect(id, i) {
  var c = LCHARTS[id]; if (!c) return;
  i = Math.max(0, Math.min(c.n - 1, i));
  UI.sel[id] = i;
  var x = c.X(i).toFixed(1), lx = $('lx_' + id);
  if (lx) { lx.setAttribute('x1', x); lx.setAttribute('x2', x); }
  c.series.forEach(function (s, si) { var d = $('ld_' + id + '_' + si); if (d) { d.setAttribute('cx', x); d.setAttribute('cy', c.Y(s.vals[i]).toFixed(1)); } });
  var ro = $('ro_' + id); if (ro) ro.innerHTML = lineReadout(id, i);
}
function linePointer(e) {
  var svg = e.target.closest ? e.target.closest('svg[data-lchart]') : null;
  if (!svg) return;
  var id = svg.getAttribute('data-lchart'), c = LCHARTS[id], rect = svg.getBoundingClientRect();
  var x = (e.clientX - rect.left) / rect.width * c.W;
  var best = 0, bd = Infinity;
  for (var i = 0; i < c.n; i++) { var d = Math.abs(c.X(i) - x); if (d < bd) { bd = d; best = i; } }
  lineSelect(id, best);
}

function planSet(c, a) {
  var P = planState(), base = bmap(P.key)[c], g = planGroup(c), cur = P.vals[c], isNew = cur && cur.isNew;
  if (cur && cur.rm) return;
  var live = base && !base.rm;

  else if (!isNew && !live && !a) delete P.vals[c];
  else P.vals[c] = { a: a, g: g, isNew: isNew ? 1 : 0 };

// Bills you seem to pay every month: same store + category in 3 of the last 4 months, similar amounts.

  var by = {};
  S.tx.forEach(function (t) {
    var k = ymKey(t.y, t.m);

    var id = low(t.v) + '|' + low(t.c);

// A trip is { name, start, end, budget, notes }. Entries belong to a trip through t.tr.
// Trip spending is shown on its own and kept out of the monthly budget.
var TRAVEL_CATS = /travel|trip|flight|airbnb|hotel|lodging/;

function tripByName(n) { var w = low(n); for (var i = 0; i < S.trips.length; i++) if (low(S.trips[i].name) === w) return S.trips[i]; return null; }

function tripEnd(t) { return t.end || t.start || ''; }
function tripFor(day) {
  if (!day) return null;
  for (var i = 0; i < S.trips.length; i++) { var t = S.trips[i]; if (t.start && t.start <= day && day <= tripEnd(t)) return t; }
  return null;
}
function tripDays(t) {
  var a = parseD(t.start), b = parseD(tripEnd(t));
  return a && b ? Math.round((b - a) / 86400000) + 1 : 0;
}
function tripRange(t) {
  var a = parseD(t.start), b = parseD(tripEnd(t));

  return MON[a.getMonth()] + ' ' + a.getDate() + (same ? '' : '–' + (b.getMonth() !== a.getMonth() ? MON[b.getMonth()] + ' ' : '') + b.getDate()) + ', ' + b.getFullYear();
}
function tripStats(name) {
  var w = low(name), s = { total: 0, cat: {}, vend: {}, items: [] };
  S.tx.forEach(function (t) {
    if (t.k !== 'e' || low(t.tr) !== w) return;
    var a = share(t);
    s.total += a; s.items.push(t);
    s.cat[low(t.c)] = (s.cat[low(t.c)] || 0) + a;
    var vk = low(t.v || t.c);

    s.vend[vk].a += a; s.vend[vk].n++;

function parseTripPlan(v) {

  String(v || '').split(/[;\n]+/).forEach(function (part) {
    var m = part.match(/^\s*(.+?)\s*[:=]\s*\$?\s*([\d,]+(?:\.\d+)?)\s*$/);
    if (m) { var a = +m[2].replace(/,/g, ''); if (a > 0) out[low(m[1])] = (out[low(m[1])] || 0) + a; }
  });
  return out;
}

      '<button class="chip' + (C.b === C.a - 12 ? ' on' : '') + '" data-act="cquick" data-v="lastyear">Same month last year</button></div>';
    if (C.a === cur || C.b === cur) h += '<div class="hint">' + MONTHS[ymM(cur)] + ' is ' + NOW.getDate() + ' of ' + daysIn(ymY(cur), ymM(cur)) + ' days in, so it will look low.</div>';
  } else {
    h += '<label class="selw"><span class="sr">First year</span><select id="cmp_ya">' + cmpYearOptions(C.ya) + '</select></label><span class="vs">vs</span>' +
      '<label class="selw"><span class="sr">Second year</span><select id="cmp_yb">' + cmpYearOptions(C.yb) + '</select></label></div>' +
      '<div class="chips cquick"><button class="chip' + (C.scope === 'ytd' ? ' on' : '') + '" data-act="cscope" data-v="ytd">Same months (to date)</button>' +
      '<button class="chip' + (C.scope === 'full' ? ' on' : '') + '" data-act="cscope" data-v="full">Full years</button></div>';
    if (P.lastM < 11) h += '<div class="hint">Comparing January through ' + MONTHS[P.lastM] + ' of each year' + (P.lastM === ymM(cur) ? ' (' + MONTHS[P.lastM] + ' ' + ymY(cur) + ' is still going)' : '') + '.</div>';
  }
  h += '</section>';

  // overall
  var rows = [
    ['Spending', A.spentAll, B.spentAll, false, 'everything, trips included'],
    ['Everyday', A.spent, B.spent, false, 'your budget categories'],
    ['Trips', A.trip, B.trip, false, ''],
    ['Income', A.inc, B.inc, true, ''],
    ['Saved', A.saved, B.saved, true, ''],
    ['Net', A.inc - A.spentAll - A.saved, B.inc - B.spentAll - B.saved, true, 'income − spending − saved']
  ];
  h += '<section class="card"><div class="ghead"><h3>Overall</h3><span>' + esc(P.A.long) + ' vs ' + esc(P.B.long) + '</span></div>';
  h += '<table class="tb ctb"><tr><th></th><th>' + esc(P.A.label) + '</th><th>' + esc(P.B.label) + '</th><th>Change</th></tr>';
  rows.forEach(function (x) {
    if (x[0] === 'Trips' && !x[1] && !x[2]) return;
    var net = x[0] === 'Net', p = pctChange(x[1], x[2]);
    h += '<tr' + (net ? ' class="tot"' : '') + '><td>' + x[0] + (x[4] ? '<small>' + x[4] + '</small>' : '') + '</td><td>' + (net ? signed(x[1]) : money(x[1])) + '</td><td>' + (net ? signed(x[2]) : money(x[2])) + '</td>' +
      '<td class="' + chgCls(x[1], x[2], x[3]) + '"><b>' + pctText(p) + '</b><small>' + (x[1] - x[2] >= 0 ? '+' : '−') + money(Math.abs(x[1] - x[2])) + '</small></td></tr>';
  });
  h += '</table><details class="itip"><summary>ⓘ <span>What this means</span></summary><div class="hint">Green is better for you: spending down, or income and savings up.</div></details></section>';

  // month by month for years
  if (C.mode === 'year') {
    var cols = [];
    for (var m = 0; m <= 11; m++) {
      var sa = monthStats(ymKey(C.ya, m)), sb = monthStats(ymKey(C.yb, m));
      var future = ymKey(C.ya, m) > cur;
      cols.push({ label: MON[m].charAt(0), vals: [future ? 0 : sa.spentAll, sb.spentAll], aria: MONTHS[m],
        info: '<b>' + MONTHS[m] + '</b> · ' + C.ya + ': ' + (future ? '—' : money(sa.spentAll)) + ' · ' + C.yb + ': ' + money(sb.spentAll) +

    }
    UI.sel.cy = UI.sel.cy === undefined ? Math.min(11, ymY(cur) === C.ya ? ymM(cur) : 11) : UI.sel.cy;
    h += '<section class="card"><div class="ghead"><h3>Spending by month</h3><span>' + C.ya + ' vs ' + C.yb + '</span></div>' +

  }

  // by category (everyday spending; trips are compared above)
  var cats = {};
  Object.keys(A.cat).concat(Object.keys(B.cat)).forEach(function (c) { if (groupOf(c, P.A.k1) !== 'save') cats[c] = 1; });
  var list = Object.keys(cats).map(function (c) { return { c: c, a: A.cat[c] || 0, b: B.cat[c] || 0 }; })

  var max = 1;

      '<div class="l2">' + esc(P.A.label) + ' ' + money(x.a, true) + ' · ' + esc(P.B.label) + ' ' + money(x.b, true) + '</div></button>';
  });
  if (list.length > 12) h += '<button class="more" data-act="call">' + (C.all ? 'Show the top 12' : 'Show all ' + list.length + ' categories') + '</button>';
  h += '<details class="itip"><summary>ⓘ <span>What this means</span></summary><div class="hint">Everyday spending only — trips are counted in the Trips row above. Tap a category to see it over time.</div></details></section>';
  return h;
}

// For one category: this month vs the month before, vs a year ago, and this year vs last year.
function catCompareHtml(c, k, key) {
  var cur = nowYM(), y = ymY(key), m = ymM(key);
  function val(kk) { var s = monthStats(kk); return k === 'i' ? (s.icat[c] || 0) : (s.cat[c] || 0) + (s.tripCat[c] || 0); }
  function ytd(yy, last) { var t = 0; for (var mm = 0; mm <= last; mm++) t += val(ymKey(yy, mm)); return t; }
  var good = k === 'i';
  var lastM = y === ymY(cur) ? ymM(cur) : 11;
  var rows = [
    [MON[m] + ' vs ' + MON[ymM(key - 1)], val(key), val(key - 1)],
    [MON[m] + ' ' + y + ' vs ' + (y - 1), val(key), val(key - 12)],
    [(lastM === 11 ? String(y) : 'Jan–' + MON[lastM] + ' ' + y) + ' vs ' + (y - 1), ytd(y, lastM), ytd(y - 1, lastM)]
  ];
  var h = '<section class="card"><div class="ghead"><h3>Compared</h3><span>' + (k === 'i' ? '' : 'trips included') + '</span></div><table class="tb ctb"><tr><th></th><th>Now</th><th>Then</th><th>Change</th></tr>';
  rows.forEach(function (x) {
    h += '<tr><td>' + esc(x[0]) + '</td><td>' + money(x[1]) + '</td><td>' + money(x[2]) + '</td><td class="' + chgCls(x[1], x[2], good) + '"><b>' + pctText(pctChange(x[1], x[2])) + '</b></td></tr>';
  });
  h += '</table>';
  // this year vs last year, month by month
  var cols = [], any = false;
  for (var mm = 0; mm < 12; mm++) {
    var fut = ymKey(y, mm) > cur, a = fut ? 0 : val(ymKey(y, mm)), b = val(ymKey(y - 1, mm));
    if (a || b) any = true;
    cols.push({ label: MON[mm].charAt(0), vals: [a, b], aria: MONTHS[mm],
      info: '<b>' + MONTHS[mm] + '</b> · ' + y + ': ' + (fut ? '—' : money(a, true)) + ' · ' + (y - 1) + ': ' + money(b, true) + (fut ? '' : ' · <b>' + pctText(pctChange(a, b)) + '</b>') });
  }
  if (any) {
    UI.sel.catyy = Math.min(11, m);
    h += '<div class="ghead" style="margin-top:14px"><h3>' + y + ' vs ' + (y - 1) + '</h3><span>by month</span></div>' + barChart('catyy', cols, { legend: [String(y), String(y - 1)] });
  }
  return h + '</section>';
}

    return '<button class="chip' + (per === p[0] ? ' on' : '') + '" data-act="period" data-v="' + p[0] + '">' + p[1] + '</button>';
  }).join('') + '</div>';
  h += per === 'week' ? trendWeek() : per === 'year' ? trendYear() : trendMonth();

}
function trendInsights() {
  var c = insightCards();
  return c.length ? c.join('') : '<div class="card empty"><b>Not enough history yet</b>Insights appear once you have a few months of entries.</div>';
}

// "Where it went": a month's spending by category, biggest first
function whereItWentHtml() {
  var cur = nowYM(), which = UI.wim || 0, k = cur - which, s = monthStats(k);
  var rows = Object.keys(s.cat).filter(function (c) { return groupOf(c, k) !== 'save' && s.cat[c] > 0; }).map(function (c) { return { c: c, a: s.cat[c] }; });
  if (s.trip > 0) rows.push({ c: 'trips', a: s.trip, trip: 1 });
  rows.sort(function (p, q) { return q.a - p.a; });
  var tot = rows.reduce(function (t, x) { return t + x.a; }, 0), max = rows.length ? rows[0].a : 1;
  var h = '<section class="card"><div class="ghead"><h3>Where it went</h3><span>' + money(tot) + '</span></div>' +
    '<div class="chips" style="margin-bottom:8px">' + [[0, 'This month'], [1, 'Last month']].map(function (x) {
      return '<button class="chip' + (which === x[0] ? ' on' : '') + '" data-act="wim" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>';
